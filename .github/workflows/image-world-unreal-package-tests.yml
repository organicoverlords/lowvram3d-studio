name: Image World Unreal package tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/image-world-unreal-package-20260802
    paths:
      - .github/workflows/image-world-unreal-package-tests.yml
      - src/lowvram3d/image_world/unreal_landscape.py
      - workers/image_world/export_unreal_landscape_package.py
      - tests/test_image_world_unreal_landscape.py

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest
      - name: Compile and test
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          python -m py_compile `
            src\lowvram3d\image_world\unreal_landscape.py `
            workers\image_world\export_unreal_landscape_package.py
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          python -m pytest tests\test_image_world_unreal_landscape.py -q
          if ($LASTEXITCODE -ne 0) { throw "Unreal Landscape tests failed" }
