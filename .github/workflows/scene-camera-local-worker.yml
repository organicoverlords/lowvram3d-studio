name: Authoritative scene camera on local PC
run-name: Scene camera proof ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/scene-pipeline-smoke-20260803
    paths:
      - .github/workflows/scene-camera-local-worker.yml
      - src/lowvram3d/scene_camera.py
      - tests/test_scene_camera.py
      - blender/apply_scene_camera_contract.py
      - blender/prepare_scene_from_spec.py

permissions:
  contents: write

concurrency:
  group: scene-camera-local-worker
  cancel-in-progress: true

jobs:
  apply-camera:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact scene branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/scene-pipeline-smoke-20260803") { throw "Untrusted ref" }
          if (@(git status --short).Count -gt 0) { throw "Checkout is dirty" }
          "WORKER_HEAD=$(git rev-parse HEAD)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Resolve CPU Python and Blender
        shell: powershell
        run: |
          $pythonCandidates = @(
            "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe",
            "C:\AI\HY3D2\python_standalone\python.exe",
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $python = $null
          foreach ($candidate in $pythonCandidates) {
            & $candidate -c "import sys; assert sys.version_info >= (3, 11)" 2>$null
            if ($LASTEXITCODE -eq 0) { $python = $candidate; break }
          }
          if (-not $python) { throw "No Python 3.11+ executable found" }
          $blender = "C:\Program Files\Blender Foundation\Blender 5.2\blender.exe"
          if (-not (Test-Path -LiteralPath $blender)) { throw "Blender 5.2 not found" }
          "SCENE_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_BLENDER=$blender" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_OUTPUT=C:\AI\ScenePipelineSmoke\20260803\castlegrounds\scene_camera_v1" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Compile and test camera contracts
        shell: powershell
        run: |
          & $env:SCENE_PYTHON -m py_compile `
            src\lowvram3d\scene_camera.py `
            tests\test_scene_camera.py `
            blender\apply_scene_camera_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Camera contract compile failed" }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $env:SCENE_PYTHON -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw "Could not ensure pytest is installed" }
          & $env:SCENE_PYTHON -m pytest `
            tests\test_scene_spec.py `
            tests\test_scene_spec_legacy.py `
            tests\test_scene_preparation.py `
            tests\test_scene_camera.py -q
          if ($LASTEXITCODE -ne 0) { throw "Camera contract tests failed" }

      - name: Generate authoritative spec and camera contract
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          $evidence = Join-Path $PWD "evidence\latest-scene-camera-local-worker"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          & $env:SCENE_PYTHON -m lowvram3d.scene_spec_legacy `
            --interpretation proof\scene\20260803-image-to-scene-smoke\scene_interpretation.json `
            --geometry proof\scene\20260803-image-to-scene-smoke\geometry_spec.json `
            --selected-asset proof\scene\20260803-image-to-scene-smoke\selected_asset.json `
            --source-mesh configs\scene\castlegrounds_source_mesh_v2.json `
            --output (Join-Path $evidence "legacy_scene_spec.json") `
            --receipt (Join-Path $evidence "legacy_migration_receipt.json")
          if ($LASTEXITCODE -ne 0) { throw "Legacy migration failed" }

          & $env:SCENE_PYTHON -m lowvram3d.scene_camera `
            --calibration proof\scene\20260803-image-to-scene-smoke\camera_calibration.json `
            --exact-blender-camera proof\scene\20260803-image-to-scene-smoke\blender_exact_source_receipt.json `
            --interpretation proof\scene\20260803-image-to-scene-smoke\scene_interpretation.json `
            --contract-output (Join-Path $evidence "camera_contract.json") `
            --receipt-output (Join-Path $evidence "camera_contract_receipt.json") `
            --scene-spec-in (Join-Path $evidence "legacy_scene_spec.json") `
            --scene-spec-out (Join-Path $evidence "authoritative_scene_spec.json")
          if ($LASTEXITCODE -ne 0) { throw "Camera contract generation failed" }

          & $env:SCENE_PYTHON -m lowvram3d.scene_spec `
            --scene-spec (Join-Path $evidence "authoritative_scene_spec.json") `
            --report (Join-Path $evidence "authoritative_scene_spec_validation.json")
          if ($LASTEXITCODE -ne 0) { throw "Authoritative SceneSpec rejected" }

      - name: Prepare blend from authoritative spec
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD\blender;$PWD"
          $evidence = Join-Path $PWD "evidence\latest-scene-camera-local-worker"
          if (Test-Path -LiteralPath $env:SCENE_OUTPUT) { Remove-Item -LiteralPath $env:SCENE_OUTPUT -Recurse -Force }
          New-Item -ItemType Directory -Path $env:SCENE_OUTPUT -Force | Out-Null
          & $env:SCENE_BLENDER -b --factory-startup `
            --python blender\prepare_scene_from_spec.py -- `
            --scene-spec (Join-Path $evidence "authoritative_scene_spec.json") `
            --output-dir $env:SCENE_OUTPUT `
            --report (Join-Path $evidence "blender_scene_preparation_receipt.json")
          if ($LASTEXITCODE -ne 0) { throw "Blend preparation failed" }

          $prep = Get-Content (Join-Path $evidence "blender_scene_preparation_receipt.json") -Raw | ConvertFrom-Json
          if ($prep.classification -ne "PROVEN") { throw "Preparation rejected" }
          "PREPARED_BLEND=$($prep.blend)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Apply exact camera basis
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-camera-local-worker"
          & $env:SCENE_BLENDER -b $env:PREPARED_BLEND `
            --python blender\apply_scene_camera_contract.py -- `
            --camera-contract (Join-Path $evidence "camera_contract.json") `
            --report (Join-Path $evidence "blender_camera_application_receipt.json")
          if ($LASTEXITCODE -ne 0) { throw "Exact camera application failed" }

      - name: Verify authoritative camera application
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-camera-local-worker"
          $camera = Get-Content (Join-Path $evidence "camera_contract_receipt.json") -Raw | ConvertFrom-Json
          $applied = Get-Content (Join-Path $evidence "blender_camera_application_receipt.json") -Raw | ConvertFrom-Json
          if ($camera.classification -ne "PROVEN") { throw "Camera contract rejected" }
          if (-not $camera.legacy_interpretation_superseded) { throw "Expected stale 48-degree camera to be superseded" }
          if ($applied.classification -ne "PROVEN") { throw "Camera application rejected: $($applied.errors | ConvertTo-Json -Compress)" }
          if ($applied.mesh_edit_operations -ne 0) { throw "Camera application edited mesh geometry" }
          if ([math]::Abs($applied.after.fov_x_deg - 66.50838470458984) -gt 0.00001) { throw "Authoritative horizontal FOV not applied" }
          if ($applied.contract_error.origin -gt 0.00001 -or $applied.contract_error.forward -gt 0.00001 -or $applied.contract_error.up -gt 0.00001 -or $applied.contract_error.right -gt 0.00001) {
            throw "Applied basis differs from contract"
          }

      - name: Publish compact camera evidence
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-camera-local-worker"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{
            classification = if ("${{ job.status }}" -eq "success") { "PROVEN" } else { "REJECTED" }
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head_sha = "${{ github.sha }}"
            worker_head = $env:WORKER_HEAD
            gpu_work_started = $false
            neural_work_started = $false
            unreal_work_started = $false
            scope = "AUTHORITATIVE_SCENE_CAMERA_AND_BLEND_PREPARATION_CPU_ONLY"
            output_root = $env:SCENE_OUTPUT
            recorded_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content (Join-Path $evidence "workflow_receipt.json") -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/latest-scene-camera-local-worker
          if (@(git status --porcelain -- evidence/latest-scene-camera-local-worker).Count -gt 0) {
            git commit -m "evidence(scene): record camera contract run ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit camera evidence" }
            git push origin HEAD:agent/scene-pipeline-smoke-20260803
            if ($LASTEXITCODE -ne 0) { throw "Could not push camera evidence" }
          }

      - name: Upload camera evidence and corrected blend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-camera-proof-${{ github.run_id }}
          path: |
            evidence/latest-scene-camera-local-worker/*.json
            C:\AI\ScenePipelineSmoke\20260803\castlegrounds\scene_camera_v1\*.blend
          if-no-files-found: warn
          retention-days: 14
