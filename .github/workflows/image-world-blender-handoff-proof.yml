name: Image World Blender handoff proof
run-name: Image World Blender proof ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/image-world-blender-handoff-20260802
    paths:
      - .github/workflows/image-world-blender-handoff-proof.yml
      - blender/image_world/**
      - src/lowvram3d/image_world/blender_mesh.py
      - workers/image_world/build_synthetic_surface_fixture.py
      - tests/test_image_world_blender_mesh.py
      - tests/test_image_world_blender_handoff.py

permissions:
  contents: read

concurrency:
  group: image-world-blender-handoff-proof
  cancel-in-progress: true

jobs:
  blender-proof:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact handoff branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify repository identity
        shell: powershell
        run: |
          $expected = "refs/heads/feature/image-world-blender-handoff-20260802"
          if ("${{ github.ref }}" -ne $expected) {
            throw "Unexpected workflow ref: ${{ github.ref }}"
          }
          if (@(git status --short).Count -gt 0) {
            throw "Checkout is dirty before execution"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") {
            throw "HEAD $head does not equal workflow SHA ${{ github.sha }}"
          }
          git remote -v

      - name: Run pure mesh tests
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Control Python is missing: $python"
          }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python -m py_compile `
            src\lowvram3d\image_world\blender_mesh.py `
            workers\image_world\build_synthetic_surface_fixture.py `
            blender\image_world\run_lighthouse_surface_scene.py
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }
          & $python -m pytest `
            tests\test_image_world_blender_mesh.py `
            tests\test_image_world_blender_handoff.py `
            -q
          if ($LASTEXITCODE -ne 0) { throw "Blender handoff tests failed" }

      - name: Build synthetic projection fixture
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          $root = Join-Path $env:RUNNER_TEMP "image-world-blender-proof"
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python workers\image_world\build_synthetic_surface_fixture.py `
            --output (Join-Path $root "projection") `
            --size 65
          if ($LASTEXITCODE -ne 0) { throw "Synthetic projection generation failed" }

      - name: Build and render headless Blender proof
        shell: powershell
        run: |
          $blender = "C:\Program Files\Blender Foundation\Blender 5.2\blender.exe"
          if (-not (Test-Path -LiteralPath $blender -PathType Leaf)) {
            throw "Blender 5.2 is missing: $blender"
          }
          $root = Join-Path $env:RUNNER_TEMP "image-world-blender-proof"
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $blender --background --python-use-system-env `
            --python blender\image_world\run_lighthouse_surface_scene.py -- `
            --projection (Join-Path $root "projection") `
            --blend-output (Join-Path $root "lighthouse-surface-proof.blend") `
            --report-output (Join-Path $root "blender-scene-report.json") `
            --render-output (Join-Path $root "lighthouse-surface-proof.png") `
            --glb-output (Join-Path $root "lighthouse-surface-diagnostic.glb") `
            --maximum-resolution 65 `
            --render-size 512
          if ($LASTEXITCODE -ne 0) { throw "Headless Blender proof failed" }

          $reportPath = Join-Path $root "blender-scene-report.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Blender scene report is missing"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne "BLENDER_DIAGNOSTIC_SCENE_BUILT") {
            throw "Unexpected Blender report status: $($report.status)"
          }
          if ($report.promotion_allowed -ne $false) {
            throw "Diagnostic scene incorrectly permits promotion"
          }
          foreach ($path in @(
            (Join-Path $root "lighthouse-surface-proof.blend"),
            (Join-Path $root "lighthouse-surface-proof.png"),
            (Join-Path $root "lighthouse-surface-diagnostic.glb")
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Expected Blender artifact is missing or empty: $path"
            }
          }
          Write-Host ($report | ConvertTo-Json -Depth 8)

      - name: Upload Blender proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-world-blender-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}\image-world-blender-proof
          if-no-files-found: error
          retention-days: 14
