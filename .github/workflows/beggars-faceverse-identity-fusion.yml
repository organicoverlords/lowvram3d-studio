name: Beggars FaceVerse identity fusion
run-name: Beggars FaceVerse identity fusion ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - tools/beggars_scene/run_faceverse_v4_identity_fusion.py
      - .github/workflows/beggars-faceverse-identity-fusion.yml

permissions:
  contents: write

concurrency:
  group: beggars-faceverse-identity-fusion
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact run identity
        run: |
          set -euo pipefail
          evidence='evidence/latest-beggars-faceverse-identity-fusion'
          mkdir -p "$evidence"
          jq -n \
            --argjson run_id '${{ github.run_id }}' \
            --arg head_sha '${{ github.sha }}' \
            --arg branch '${{ github.ref_name }}' \
            --arg url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{classification:"RUN_REGISTERED",workflow_run_id:$run_id,status:"in_progress",conclusion:null,head_sha:$head_sha,head_branch:$branch,url:$url}' \
            > "$evidence/run-registration.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence/run-registration.json"
          git commit -m 'evidence(scene): register FaceVerse identity fusion ${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then exit 0; fi
            test "$attempt" -lt 4
            sleep 2
          done

  fuse-and-render:
    needs: register
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact fusion source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify cached FaceVerse runtime and GPU availability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\AI\LowVRAM3D-cache\faceverse-v4\venv-py39-cu118\Scripts\python.exe'
          $source = 'C:\AI\LowVRAM3D-cache\faceverse-v4\source-19c67cc4d7234b1ea7d55a185a2cb55fd49bb877'
          $model = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_v4_2.npy'
          $checkpoint = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_resnet50.pth'
          $landmarker = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\face_landmarker.task'
          foreach ($required in @($python, $source, $model, $checkpoint, $landmarker)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Fusion input missing: $required" }
          }
          $gpuLine = (& nvidia-smi --query-compute-apps=used_memory --format=csv,noheader,nounits 2>$null | Out-String).Trim()
          $gpuUsed = 0
          if ($gpuLine) {
            foreach ($line in $gpuLine -split "`r?`n") {
              $value = 0
              if ([int]::TryParse($line.Trim(), [ref]$value)) { $gpuUsed += $value }
            }
          }
          Write-Host "GPU_USED_MIB=$gpuUsed"
          if ($gpuUsed -ge 4800) { throw "GPU_BUSY: $gpuUsed MiB" }
          & $python -I -u -X faulthandler -c "import torch; assert torch.__version__.startswith('2.5.1'), torch.__version__; assert torch.version.cuda == '11.8', torch.version.cuda; assert torch.cuda.is_available(); print('FACEVERSE_FUSION_CUDA_RUNTIME=PROVEN',torch.__version__,torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'FaceVerse fusion CUDA runtime validation failed' }

          $scriptPath = 'tools\beggars_scene\run_faceverse_v4_identity_fusion.py'
          $text = Get-Content -LiteralPath $scriptPath -Raw
          $oldProjected = @'
    points = projected.detach().cpu().numpy().astype(np.float32)
'@.TrimEnd()
          $newProjected = @'
    points = (
        projected.detach().cpu().numpy().astype(np.float32)
        if isinstance(projected, torch.Tensor)
        else np.asarray(projected, dtype=np.float32)
    )
'@.TrimEnd()
          $oldColors = @'
    base = pca_colors.detach().cpu().numpy().astype(np.float32)
'@.TrimEnd()
          $newColors = @'
    base = (
        pca_colors.detach().cpu().numpy().astype(np.float32)
        if isinstance(pca_colors, torch.Tensor)
        else np.asarray(pca_colors, dtype=np.float32)
    )
'@.TrimEnd()
          if (-not $text.Contains($oldProjected)) { throw 'Could not locate projected-array compatibility anchor' }
          if (-not $text.Contains($oldColors)) { throw 'Could not locate color-array compatibility anchor' }
          $text = $text.Replace($oldProjected, $newProjected).Replace($oldColors, $newColors)
          [System.IO.File]::WriteAllText(
            (Resolve-Path -LiteralPath $scriptPath),
            $text,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host 'FACEVERSE_FUSION_NUMPY_OUTPUT_COMPAT=PROVEN'

          & $python -m py_compile $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'FaceVerse identity fusion source failed compilation' }
          "FUSION_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "FUSION_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV
          "FUSION_MODEL=$model" | Add-Content -LiteralPath $env:GITHUB_ENV
          "FUSION_CHECKPOINT=$checkpoint" | Add-Content -LiteralPath $env:GITHUB_ENV
          "FUSION_LANDMARKER=$landmarker" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Fuse identity and render visual comparisons
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "C:\AI\LowVRAM3D-benchmarks\beggars-scene\faceverse-identity-fusion-${{ github.run_id }}"
          $clip = Join-Path $output 'public_reference.mp4'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          curl.exe -L --fail --retry 3 --retry-delay 2 --output $clip 'https://media.tenor.com/e8wT4qAP6zwAAAPo/somebody-get-these-beggars-out-of-here-the-odyssey.mp4'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $clip)) { throw 'Could not download public reference clip' }
          $previousNoUser = $env:PYTHONNOUSERSITE
          $previousPath = $env:PYTHONPATH
          $previousUnbuffered = $env:PYTHONUNBUFFERED
          $previousPipNoIndex = $env:PIP_NO_INDEX
          $previousUvOffline = $env:UV_OFFLINE
          try {
            $env:PYTHONNOUSERSITE = '1'
            $env:PYTHONPATH = ''
            $env:PYTHONUNBUFFERED = '1'
            $env:PIP_NO_INDEX = '1'
            $env:UV_OFFLINE = '1'
            & $env:FUSION_PYTHON -I -u -X faulthandler tools\beggars_scene\run_faceverse_v4_identity_fusion.py `
              --faceverse-root $env:FUSION_SOURCE `
              --model-npy $env:FUSION_MODEL `
              --checkpoint $env:FUSION_CHECKPOINT `
              --landmarker $env:FUSION_LANDMARKER `
              --clip $clip `
              --output-dir $output `
              --frames '19,21,23,25,27,29,31,33,35' `
              --anchors '21,31,35' `
              --device auto
            if ($LASTEXITCODE -ne 0) { throw "FaceVerse identity fusion failed with exit code $LASTEXITCODE" }
          }
          finally {
            $env:PYTHONNOUSERSITE = $previousNoUser
            $env:PYTHONPATH = $previousPath
            $env:PYTHONUNBUFFERED = $previousUnbuffered
            $env:PIP_NO_INDEX = $previousPipNoIndex
            $env:UV_OFFLINE = $previousUvOffline
            Remove-Item -LiteralPath $clip -Force -ErrorAction SilentlyContinue
          }
          foreach ($name in @('faceverse_identity_fusion.jpg','faceverse_identity_fusion.json','faceverse_identity_fusion_coefficients.npz')) {
            $path = Join-Path $output $name
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "FaceVerse fusion output missing or empty: $name"
            }
          }
          "FACEVERSE_FUSION_OUTPUT=$output" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Upload identity-fusion visual proof
        uses: actions/upload-artifact@v4
        with:
          name: beggars-faceverse-identity-fusion-${{ github.run_id }}
          path: |
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/faceverse_identity_fusion.jpg
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/faceverse_identity_fusion.json
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/faceverse_identity_fusion_coefficients.npz
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/fusion_*_compare.jpg
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/fusion_*_pca.png
            ${{ env.FACEVERSE_FUSION_OUTPUT }}/fusion_*_projected.png
          if-no-files-found: error
          retention-days: 7
