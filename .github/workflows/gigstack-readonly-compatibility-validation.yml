name: GigStack Capture Compatibility And Native Validation

on:
  workflow_dispatch:
  push:
    branches:
      - validation/gigstack-readonly-compatibility-20260805
    paths:
      - ".github/workflows/gigstack-readonly-compatibility-validation.yml"

permissions:
  contents: read

concurrency:
  group: gigstack-readonly-compatibility-validation
  cancel-in-progress: true

jobs:
  validate-private-gigstack-commit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      GIGSTACK_COMMIT: 2b2a9b5b638b4ccb320b908794f919dc4c53dfbf
      TRAYCER_COMMIT: 8f21d506f9945e409f4cd72f32c71e8810a4d236
      CUDA_VISIBLE_DEVICES: "-1"
      VITE_DESKTOP_LOCAL_STORAGE_KEY: gigstack-traycer-readonly-compatibility-v1
    steps:
      - uses: actions/checkout@v4

      - name: Initialize bounded evidence paths
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gigstack-validation-evidence-$env:GITHUB_RUN_ID"
          $profile = Join-Path $env:RUNNER_TEMP "gigstack-validation-profile-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          "GIGSTACK_VALIDATION_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GIGSTACK_VALIDATION_USER_DATA=$profile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{
            schema = "GIGSTACK_VALIDATION_PREFLIGHT_V1"
            runId = $env:GITHUB_RUN_ID
            runner = $env:RUNNER_NAME
            gigstackCommit = $env:GIGSTACK_COMMIT
            traycerCommit = $env:TRAYCER_COMMIT
            cpuOnly = $true
          } | ConvertTo-Json | Set-Content (Join-Path $output "preflight.json") -Encoding utf8NoBOM

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Select an installed complete Rust toolchain without downloads
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path -LiteralPath $cargoBin -PathType Container)) {
            throw "Installed Rust cargo directory is missing: $cargoBin"
          }
          $rustup = Join-Path $cargoBin "rustup.exe"
          if (-not (Test-Path -LiteralPath $rustup -PathType Leaf)) {
            throw "Installed rustup executable is missing: $rustup"
          }
          $cargoBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          $toolchainOutput = @(& $rustup toolchain list 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "rustup toolchain list failed: $($toolchainOutput -join ' | ')"
          }
          $candidates = @(
            foreach ($line in $toolchainOutput) {
              $trimmed = ([string]$line).Trim()
              if ($trimmed) {
                $name = ($trimmed -split '\s+')[0]
                if ($name -match '^[A-Za-z0-9._-]+$') { $name }
              }
            }
          ) | Select-Object -Unique
          if ($candidates.Count -eq 0) {
            throw "No installed Rust toolchains were reported"
          }

          $selected = $null
          $attempts = @()
          foreach ($candidate in $candidates) {
            $rustcVersion = (& $rustup run $candidate rustc --version 2>&1 | Out-String).Trim()
            $rustcExit = $LASTEXITCODE
            $cargoVersion = (& $rustup run $candidate cargo --version 2>&1 | Out-String).Trim()
            $cargoExit = $LASTEXITCODE
            $rustfmtVersion = (& $rustup run $candidate rustfmt --version 2>&1 | Out-String).Trim()
            $rustfmtExit = $LASTEXITCODE
            $attempts += [ordered]@{
              toolchain = $candidate
              rustcExit = $rustcExit
              cargoExit = $cargoExit
              rustfmtExit = $rustfmtExit
            }
            if ($rustcExit -eq 0 -and $cargoExit -eq 0 -and $rustfmtExit -eq 0) {
              $selected = $candidate
              break
            }
          }
          if (-not $selected) {
            [ordered]@{
              schema = "GIGSTACK_WINDOWS_RUST_PREFLIGHT_FAILURE_V1"
              installedToolchains = $candidates
              attempts = $attempts
              downloadsAttempted = $false
              bashUsed = $false
              wslUsed = $false
            } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "rust-preflight-failure.json") -Encoding utf8NoBOM
            throw "No installed Rust toolchain contains working rustc, cargo, and rustfmt"
          }

          "RUSTUP_TOOLCHAIN=$selected" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $env:RUSTUP_TOOLCHAIN = $selected
          $rustcVersion = (& rustc --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "selected rustc preflight failed" }
          $cargoVersion = (& cargo --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "selected cargo preflight failed" }
          $rustfmtVersion = (& rustfmt --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "selected rustfmt preflight failed" }
          [ordered]@{
            schema = "GIGSTACK_WINDOWS_RUST_PREFLIGHT_V2"
            selectedToolchain = $selected
            installedToolchains = $candidates
            rustc = $rustcVersion
            cargo = $cargoVersion
            rustfmt = $rustfmtVersion
            downloadsAttempted = $false
            bashUsed = $false
            wslUsed = $false
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "rust-preflight.json") -Encoding utf8NoBOM

      - name: Prove machine and private-repository access
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          gh auth status
          if ($LASTEXITCODE -ne 0) { throw "LOWVRAM3D-KONE has no usable GitHub CLI login" }
          $private = (& gh api repos/organicoverlords/gigstack --jq .private | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $private -ne "true") { throw "Runner cannot read private GigStack" }
          "GIGSTACK_VALIDATION_RUNNER=$env:RUNNER_NAME"
          "GIGSTACK_VALIDATION_GPU_USAGE=DISABLED"

      - name: Clone exact private GigStack and public Traycer commits
        shell: pwsh
        run: |
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $gigstack = Join-Path $env:RUNNER_TEMP "gigstack-validation-$env:GITHUB_RUN_ID"
          $traycer = Join-Path $env:RUNNER_TEMP "traycer-validation-$env:GITHUB_RUN_ID"
          foreach ($candidate in @($gigstack, $traycer)) {
            if (Test-Path -LiteralPath $candidate) { Remove-Item -LiteralPath $candidate -Recurse -Force }
          }
          gh repo clone organicoverlords/gigstack $gigstack -- --filter=blob:none
          if ($LASTEXITCODE -ne 0) { throw "Private GigStack clone failed" }
          git -C $gigstack checkout --detach $env:GIGSTACK_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Exact GigStack checkout failed" }
          if (((git -C $gigstack rev-parse HEAD | Out-String).Trim()) -ne $env:GIGSTACK_COMMIT) { throw "GigStack commit mismatch" }
          git clone --filter=blob:none https://github.com/traycerai/traycer.git $traycer
          if ($LASTEXITCODE -ne 0) { throw "Traycer clone failed" }
          git -C $traycer checkout --detach $env:TRAYCER_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Exact Traycer checkout failed" }
          if (((git -C $traycer rev-parse HEAD | Out-String).Trim()) -ne $env:TRAYCER_COMMIT) { throw "Traycer commit mismatch" }
          "GIGSTACK_VALIDATION_ROOT=$gigstack" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TRAYCER_VALIDATION_ROOT=$traycer" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Format and test capture filesystem and native runtime crates
        shell: pwsh
        run: |
          Push-Location $env:GIGSTACK_VALIDATION_ROOT
          try {
            $cratePaths = @(
              "crates\traycer-capture-cli",
              "crates\orchestrator-captured-runtime",
              "crates\local-filesystem-provider",
              "crates\orchestrator-native-runtime"
            )
            $owned = @(
              foreach ($cratePath in $cratePaths) {
                Get-ChildItem -LiteralPath $cratePath -Filter *.rs -File -Recurse
              }
            ) | Sort-Object FullName | ForEach-Object { $_.FullName }
            if ($owned.Count -eq 0) { throw "No capture/filesystem/native runtime Rust files found" }
            rustfmt --edition 2024 --check @owned
            if ($LASTEXITCODE -ne 0) { throw "Capture/filesystem/native-runtime rustfmt failed" }
            cargo test `
              -p traycer-capture-cli `
              -p orchestrator-captured-runtime `
              -p local-filesystem-provider `
              -p orchestrator-native-runtime
            if ($LASTEXITCODE -ne 0) { throw "Capture/filesystem/native-runtime tests failed" }
            $lockChanged = -not [string]::IsNullOrWhiteSpace((git diff -- Cargo.lock | Out-String))
            if ($lockChanged) {
              Copy-Item -LiteralPath Cargo.lock -Destination (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "generated-Cargo.lock") -Force
            }
            [ordered]@{
              schema = "GIGSTACK_RUST_VALIDATION_RECEIPT_V1"
              crates = $cratePaths
              formattingPassed = $true
              testsPassed = $true
              cargoLockChanged = $lockChanged
              stateChangingToolExecutions = 0
              agentMessagesSent = 0
            } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "rust-validation.json") -Encoding utf8NoBOM
          } finally {
            Pop-Location
          }
          "GIGSTACK_CAPTURE_FILESYSTEM_NATIVE_TESTS=PROVEN"

      - name: Apply exact fail-closed Traycer overlay
        shell: pwsh
        run: |
          python (Join-Path $env:GIGSTACK_VALIDATION_ROOT "integrations\traycer-desktop\apply_overlay.py") $env:TRAYCER_VALIDATION_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Overlay application failed" }
          $manifest = Get-Content (Join-Path $env:TRAYCER_VALIDATION_ROOT "gigstack-orchestrator-overlay-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.schema -ne "GIGSTACK_TRAYCER_OVERLAY_MANIFEST_V1") { throw "Overlay manifest schema mismatch" }
          if ($manifest.traycer_commit -ne $env:TRAYCER_COMMIT) { throw "Overlay pin mismatch" }
          if (@($manifest.changed_paths).Count -ne 13) { throw "Overlay path count mismatch" }

      - name: Install and compile pinned Traycer desktop
        shell: pwsh
        run: |
          Push-Location $env:TRAYCER_VALIDATION_ROOT
          try {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw "Frozen dependency installation failed" }
          } finally { Pop-Location }
          $desktop = Join-Path $env:TRAYCER_VALIDATION_ROOT "clients\desktop"
          Push-Location $desktop
          try {
            bun run compile
            if ($LASTEXITCODE -ne 0) { throw "Traycer TypeScript compile failed" }
            bun run build:main
            if ($LASTEXITCODE -ne 0) { throw "Traycer main/preload build failed" }
            bun run build:renderer
            if ($LASTEXITCODE -ne 0) { throw "Traycer renderer build failed" }
          } finally { Pop-Location }

      - name: Exercise all five read-only compatibility states
        shell: pwsh
        run: |
          $desktop = Join-Path $env:TRAYCER_VALIDATION_ROOT "clients\desktop"
          $bundle = Join-Path $env:RUNNER_TEMP "gigstack-compatibility-$env:GITHUB_RUN_ID.cjs"
          Push-Location $desktop
          try {
            bun x esbuild src/electron-main/orchestrator-browser/chatgpt-dom-adapter.ts --bundle --platform=node --format=cjs --external:electron --outfile=$bundle
            if ($LASTEXITCODE -ne 0) { throw "Inspector bundle failed" }
            $electronLines = @(& bun -e 'console.log(require("electron"))')
            if ($LASTEXITCODE -ne 0 -or $electronLines.Count -eq 0) { throw "Electron path resolution failed" }
            $electron = ([string]$electronLines[-1]).Trim()
          } finally { Pop-Location }
          if (-not (Test-Path -LiteralPath $electron -PathType Leaf)) { throw "Electron executable is missing" }
          $env:GIGSTACK_COMPATIBILITY_ADAPTER_BUNDLE = $bundle
          $env:GIGSTACK_COMPATIBILITY_OUTPUT_DIR = $env:GIGSTACK_VALIDATION_OUTPUT
          $env:GIGSTACK_COMPATIBILITY_USER_DATA_DIR = $env:GIGSTACK_VALIDATION_USER_DATA
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & $electron --disable-gpu --disable-software-rasterizer (Join-Path $env:GIGSTACK_VALIDATION_ROOT "integrations\traycer-desktop\readonly_compatibility_probe.cjs")
          if ($LASTEXITCODE -ne 0) { throw "Read-only compatibility probe failed" }

      - name: Independently validate and bind proof receipt
        shell: pwsh
        run: |
          $receiptPath = Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "readonly-compatibility-receipt.json"
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) { throw "Compatibility receipt is missing" }
          $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
          $expected = @("SAFE_CANARY", "SESSION_READY", "AUTH_REQUIRED", "BOT_CHALLENGE", "DOM_INCOMPATIBLE")
          if ($receipt.schema -ne "GIGSTACK_CHATGPT_READONLY_COMPATIBILITY_PROOF_V1") { throw "Receipt schema mismatch" }
          if ((@($receipt.observedStates) -join "|") -ne ($expected -join "|")) { throw "State order mismatch" }
          if ([int]$receipt.fixtureCount -ne 5) { throw "Fixture count mismatch" }
          if ($receipt.realChatGptNetworkUsed -ne $false -or $receipt.realChatGptSubmissionEnabled -ne $false) { throw "Real ChatGPT boundary violated" }
          if ([int]$receipt.totalDomMutations -ne 0 -or [int]$receipt.totalPromptSubmissions -ne 0) { throw "Read-only boundary violated" }
          if ([int]$receipt.machineToolExecutions -ne 0 -or [int]$receipt.agentMessagesSent -ne 0) { throw "Side-effect boundary violated" }
          if ($receipt.verdict -ne "TRAYCER_CHATGPT_READONLY_COMPATIBILITY_SYNTHETIC_PROVEN") { throw "Verdict mismatch" }
          $rustReceipt = Get-Content (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "rust-validation.json") -Raw | ConvertFrom-Json
          [ordered]@{
            schema = "GIGSTACK_CROSS_REPO_VALIDATION_RECEIPT_V5"
            runner = $env:RUNNER_NAME
            gigstackCommit = $env:GIGSTACK_COMMIT
            traycerCommit = $env:TRAYCER_COMMIT
            compatibilityReceiptSha256 = (Get-FileHash $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
            captureIntegrationTestsPassed = $true
            filesystemProviderTestsPassed = $true
            nativeRuntimeTestsPassed = $true
            cargoLockChanged = [bool]$rustReceipt.cargoLockChanged
            cpuOnly = $true
            rustToolchainDownloadsAttempted = $false
            bashUsed = $false
            wslUsed = $false
            realChatGptNetworkUsed = $false
            promptSubmissions = 0
            stateChangingFilesystemOperations = 0
            machineToolExecutionsDuringCompatibilityProbe = 0
            agentMessagesSent = 0
            verdict = "CAPTURE_COMPATIBILITY_FILESYSTEM_AND_NATIVE_RUNTIME_PROVEN"
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:GIGSTACK_VALIDATION_OUTPUT "cross-repo-validation-receipt.json") -Encoding utf8NoBOM
          "GIGSTACK_CAPTURE_COMPATIBILITY_FILESYSTEM_NATIVE_PROVEN=YES"

      - name: Upload bounded proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigstack-capture-compatibility-native-${{ github.run_id }}
          path: ${{ env.GIGSTACK_VALIDATION_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean private source and profile copies
        if: always()
        shell: pwsh
        run: |
          foreach ($candidate in @($env:GIGSTACK_VALIDATION_ROOT, $env:TRAYCER_VALIDATION_ROOT, $env:GIGSTACK_VALIDATION_USER_DATA)) {
            if ($candidate -and (Test-Path -LiteralPath $candidate)) { Remove-Item $candidate -Recurse -Force -ErrorAction SilentlyContinue }
          }
