name: Image World lighthouse MoGe probe
run-name: Lighthouse MoGe hardware probe ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      force_when_gpu_busy:
        description: Run even when another compute process is using the GPU
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: image-world-lighthouse-moge-probe
  cancel-in-progress: false

env:
  LIGHTHOUSE_FIXTURE_SHA256: "4847ca1ceaba7da83bccd698cbbad56b99d6288530c9e5eab957339caf0302cb"

jobs:
  lighthouse-moge:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify repository and fixture identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $expectedRef = "refs/heads/feature/image-world-lighthouse-probe-20260802"
          if ("${{ github.ref }}" -ne $expectedRef) {
            throw "Unexpected ref. Expected $expectedRef, got ${{ github.ref }}"
          }
          if (@(git status --short).Count -gt 0) {
            throw "Runner checkout is dirty before execution"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") {
            throw "Checked-out HEAD $head does not equal workflow SHA ${{ github.sha }}"
          }
          $remote = (git remote get-url origin).Trim()
          if ($remote -notmatch "organicoverlords/lowvram3d-studio") {
            throw "Unexpected origin remote: $remote"
          }
          $fixture = Join-Path $PWD "benchmarks\image_world\fixtures\lighthouse_probe_512_q80.jpg"
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw "Lighthouse fixture is missing: $fixture"
          }
          $actual = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LIGHTHOUSE_FIXTURE_SHA256) {
            throw "Lighthouse fixture hash mismatch. Expected $env:LIGHTHOUSE_FIXTURE_SHA256, got $actual"
          }
          Write-Host "REPO=$PWD"
          Write-Host "BRANCH=${{ github.ref_name }}"
          Write-Host "HEAD=$head"
          Write-Host "REMOTE=$remote"
          Write-Host "FIXTURE_SHA256=$actual"

      - name: Verify GPU is idle
        id: gpu_preflight
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "image-world-lighthouse-moge"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $rows = @()
          try {
            $rows = @(
              & nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader,nounits 2>$null |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          } catch {
            throw "Could not query GPU compute processes: $($_.Exception.Message)"
          }
          $busy = $rows.Count -gt 0
          [ordered]@{
            status = $(if ($busy) { "GPU_BUSY" } else { "GPU_IDLE" })
            force_when_gpu_busy = [System.Convert]::ToBoolean("${{ inputs.force_when_gpu_busy }}")
            compute_processes = $rows
            checked_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $output "gpu-preflight.json") -Encoding utf8
          if ($busy -and "${{ inputs.force_when_gpu_busy }}" -ne "true") {
            Write-Host "GPU_BUSY_BLOCKED"
            $rows | ForEach-Object { Write-Host "GPU_PROCESS=$_" }
            throw "GPU is currently busy. Re-run manually after it is idle, or explicitly enable force_when_gpu_busy."
          }
          Write-Host "GPU_PREFLIGHT=PASS"

      - name: Compile probe and run focused tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "LowVRAM3D control Python is missing: $python"
          }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python -m py_compile `
            workers\image_world\moge_probe.py `
            workers\image_world\render_moge_previews.py `
            src\lowvram3d\image_world\moge_probe.py `
            src\lowvram3d\image_world\moge_preview.py
          if ($LASTEXITCODE -ne 0) { throw "Image-world probe compilation failed" }
          & $python -m pytest `
            tests\test_image_world_moge_probe.py `
            tests\test_image_world_moge_preview.py `
            -q
          if ($LASTEXITCODE -ne 0) { throw "Focused image-world probe tests failed" }

      - name: Run lighthouse hardware probe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $PWD "benchmarks\image_world\fixtures\lighthouse_probe_512_q80.jpg"
          $output = Join-Path $env:RUNNER_TEMP "image-world-lighthouse-moge"
          & .\scripts\run-image-world-lighthouse-moge-probe.ps1 `
            -ImagePath $fixture `
            -CanonicalParentSha256 $env:LIGHTHOUSE_FIXTURE_SHA256 `
            -FixtureSha256 $env:LIGHTHOUSE_FIXTURE_SHA256 `
            -OutputRoot $output `
            -NumTokens 1200 `
            -InputLongEdge 512 `
            -MaxGpuMemoryMb 5600
          if ($LASTEXITCODE -ne 0) {
            throw "Lighthouse MoGe probe failed with exit code $LASTEXITCODE"
          }

      - name: Publish compact probe evidence
        if: always()
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP "image-world-lighthouse-moge"
          $evidence = Join-Path $PWD "evidence\latest-image-world-lighthouse-moge"
          if (Test-Path -LiteralPath $evidence) {
            Remove-Item -LiteralPath $evidence -Recurse -Force
          }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          foreach ($name in @("gpu-preflight.json", "setup-report.json", "moge-probe-report.json")) {
            $path = Join-Path $source $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Copy-Item -LiteralPath $path -Destination (Join-Path $evidence $name) -Force
            }
          }
          $previewSource = Join-Path $source "previews"
          if (Test-Path -LiteralPath $previewSource -PathType Container) {
            Copy-Item -LiteralPath $previewSource -Destination (Join-Path $evidence "previews") -Recurse -Force
          }
          $probeStatus = "MISSING"
          $peakReservedMb = $null
          $probeReport = Join-Path $source "moge-probe-report.json"
          if (Test-Path -LiteralPath $probeReport -PathType Leaf) {
            try {
              $probe = Get-Content -LiteralPath $probeReport -Raw | ConvertFrom-Json
              $probeStatus = $probe.status
              $peakReservedMb = $probe.peak_gpu_reserved_mb
            } catch {
              $probeStatus = "INVALID_REPORT"
            }
          } elseif (Test-Path -LiteralPath (Join-Path $source "gpu-preflight.json") -PathType Leaf) {
            try {
              $preflight = Get-Content -LiteralPath (Join-Path $source "gpu-preflight.json") -Raw | ConvertFrom-Json
              $probeStatus = $preflight.status
            } catch {
              $probeStatus = "INVALID_GPU_PREFLIGHT"
            }
          }
          [ordered]@{
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            branch = "${{ github.ref_name }}"
            head_sha = "${{ github.sha }}"
            probe_status = $probeStatus
            peak_gpu_reserved_mb = $peakReservedMb
            fixture_sha256 = $env:LIGHTHOUSE_FIXTURE_SHA256
            raw_geometry_in_artifact = (Test-Path -LiteralPath (Join-Path $source "geometry\points.npy"))
            recorded_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $evidence "workflow-receipt.json") -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/latest-image-world-lighthouse-moge
          if (@(git status --porcelain -- evidence/latest-image-world-lighthouse-moge).Count -gt 0) {
            git commit -m "evidence: record lighthouse MoGe probe ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit lighthouse probe evidence" }
            git push origin HEAD:feature/image-world-lighthouse-probe-20260802
            if ($LASTEXITCODE -ne 0) { throw "Could not push lighthouse probe evidence" }
          }

      - name: Upload raw geometry maps and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-world-lighthouse-moge-${{ github.run_id }}
          path: ${{ runner.temp }}\image-world-lighthouse-moge
          if-no-files-found: warn
          retention-days: 14
