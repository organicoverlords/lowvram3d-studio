name: Beggars v2 run registrar
run-name: Register beggars v2 run ${{ github.sha }}

on:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - .github/workflows/beggars-scene-local-worker-v2.yml

permissions:
  actions: read
  contents: write

jobs:
  register-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: agent/blender-beggars-scene-20260804
          fetch-depth: 0

      - name: Locate run and record Windows runner state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=''
          for attempt in $(seq 1 30); do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/beggars-scene-local-worker-v2.yml/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=20")"
            run_json="$(printf '%s' "$response" | jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty')"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_json" ]]; then
            echo "No v2 workflow run registered for $GITHUB_SHA" >&2
            exit 1
          fi

          runners_response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          runner_json="$(printf '%s' "$runners_response" | jq -c '[.runners[] | select(([.labels[].name] | index("self-hosted")) and ([.labels[].name] | index("Windows")) and ([.labels[].name] | index("X64")))] | first // null')"

          evidence='evidence/latest-beggars-scene-v2'
          mkdir -p "$evidence"
          jq -n \
            --argjson run "$run_json" \
            --argjson runner "$runner_json" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              classification: "RUN_REGISTERED",
              workflow_run_id: $run.id,
              workflow_name: $run.name,
              workflow_path: $run.path,
              event: $run.event,
              status: $run.status,
              conclusion: $run.conclusion,
              head_sha: $run.head_sha,
              head_branch: $run.head_branch,
              url: $run.html_url,
              created_at: $run.created_at,
              updated_at: $run.updated_at,
              runner_classification: (if $runner == null then "RUNNER_NOT_REGISTERED" elif $runner.status == "online" then "RUNNER_ONLINE" else "RUNNER_OFFLINE" end),
              runner: $runner,
              observed_at: $observed_at
            }' > "$evidence/run-registration.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$evidence/run-registration.json"
          git commit -m "evidence(scene): register beggars v2 run ${GITHUB_RUN_ID}"
          git pull --rebase origin agent/blender-beggars-scene-20260804
          git push origin HEAD:agent/blender-beggars-scene-20260804
