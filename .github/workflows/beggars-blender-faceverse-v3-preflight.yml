name: Beggars canonical FaceVerse Blender v6 preflight
run-name: Beggars canonical FaceVerse Blender v6 preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - tools/beggars_scene/export_faceverse_v4_blender_canonical.py
      - blender/diagnose_beggars_faceverse_canonical_v6.py
      - scripts/run-beggars-faceverse-canonical-blender-v6.ps1
      - .github/workflows/beggars-blender-faceverse-v3-preflight.yml

permissions:
  contents: write

concurrency:
  group: beggars-blender-faceverse-v3-preflight
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact canonical v6 run identity
        run: |
          set -euo pipefail
          evidence='evidence/latest-beggars-faceverse-canonical-blender-v6'
          mkdir -p "$evidence"
          jq -n \
            --argjson run_id '${{ github.run_id }}' \
            --arg head_sha '${{ github.sha }}' \
            --arg branch '${{ github.ref_name }}' \
            --arg url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{classification:"RUN_REGISTERED",workflow_run_id:$run_id,status:"in_progress",conclusion:null,head_sha:$head_sha,head_branch:$branch,url:$url}' \
            > "$evidence/run-registration.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence/run-registration.json"
          git commit -m 'evidence(scene): register canonical Blender v6 ${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then exit 0; fi
            test "$attempt" -lt 4
            sleep 2
          done

  build-and-render:
    needs: register
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout exact canonical v6 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Export canonical head and render bounded still variants
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\run-beggars-faceverse-canonical-blender-v6.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical Blender v6 worker failed with exit code $LASTEXITCODE"
          }

      - name: Upload canonical Blender v6 visual proof
        uses: actions/upload-artifact@v4
        with:
          name: beggars-faceverse-canonical-blender-v6-${{ github.run_id }}
          path: |
            ${{ env.CB6_OUTPUT }}/canonical_blender_contact_sheet.jpg
            ${{ env.CB6_OUTPUT }}/01_raw_canonical.png
            ${{ env.CB6_OUTPUT }}/02_cranium_corrected.png
            ${{ env.CB6_OUTPUT }}/03_corrected_groomed.png
            ${{ env.CB6_OUTPUT }}/04_corrected_groomed_uniform_teeth.png
            ${{ env.CB6_OUTPUT }}/canonical_blender_diagnostic.json
            ${{ env.CB6_OUTPUT }}/canonical_export_report.json
          if-no-files-found: error
          retention-days: 7
