name: Beggars Blender FaceVerse v3 preflight
run-name: Beggars Blender FaceVerse v3 preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - blender/build_beggars_meme_scene_faceverse_v3.py
      - .github/workflows/beggars-blender-faceverse-v3-preflight.yml

permissions:
  contents: write

concurrency:
  group: beggars-blender-faceverse-v3-preflight
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact run identity
        run: |
          set -euo pipefail
          evidence='evidence/latest-beggars-blender-faceverse-v3-preflight'
          mkdir -p "$evidence"
          jq -n \
            --argjson run_id '${{ github.run_id }}' \
            --arg head_sha '${{ github.sha }}' \
            --arg branch '${{ github.ref_name }}' \
            --arg url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{classification:"RUN_REGISTERED",workflow_run_id:$run_id,status:"in_progress",conclusion:null,head_sha:$head_sha,head_branch:$branch,url:$url}' \
            > "$evidence/run-registration.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence/run-registration.json"
          git commit -m 'evidence(scene): register groomed Blender v3 preflight ${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then exit 0; fi
            test "$attempt" -lt 4
            sleep 2
          done

  build-and-render:
    needs: register
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout exact groomed Blender v3 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify cached runtime and source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\AI\LowVRAM3D-cache\faceverse-v4\venv-py39-cu118\Scripts\python.exe'
          $source = 'C:\AI\LowVRAM3D-cache\faceverse-v4\source-19c67cc4d7234b1ea7d55a185a2cb55fd49bb877'
          $model = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_v4_2.npy'
          $checkpoint = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_resnet50.pth'
          $coefficients = 'C:\AI\LowVRAM3D-benchmarks\beggars-scene\faceverse-shared-identity-fit-v2-30875541045\faceverse_shared_identity_fit_coefficients.npz'
          $blender = 'C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'
          foreach ($required in @($python,$source,$model,$checkpoint,$coefficients,$blender)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Blender v3 input missing: $required" }
          }
          & $python -I -u -X faulthandler -c "import torch; assert torch.__version__.startswith('2.5.1'), torch.__version__; assert torch.cuda.is_available(); print('BLENDER_V3_FACEVERSE_RUNTIME=PROVEN',torch.__version__,torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'Blender v3 FaceVerse runtime validation failed' }
          & $python -m py_compile tools\beggars_scene\export_faceverse_v4_blender_sequence.py
          if ($LASTEXITCODE -ne 0) { throw 'Blender v3 sequence exporter failed compilation' }
          "B3_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_MODEL=$model" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_CHECKPOINT=$checkpoint" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_COEFFICIENTS=$coefficients" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_BLENDER=$blender" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Export optimized three-key sequence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "C:\AI\LowVRAM3D-benchmarks\beggars-scene\blender-faceverse-v3-preflight-${{ github.run_id }}"
          $private = Join-Path $output '_private'
          $clip = Join-Path $private 'public_reference.mp4'
          $sequence = Join-Path $private 'faceverse_v2_sequence.npz'
          $report = Join-Path $output 'faceverse_v2_sequence_report.json'
          New-Item -ItemType Directory -Path $private -Force | Out-Null
          curl.exe -L --fail --retry 3 --retry-delay 2 --output $clip 'https://media.tenor.com/e8wT4qAP6zwAAAPo/somebody-get-these-beggars-out-of-here-the-odyssey.mp4'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $clip)) { throw 'Could not download public reference clip' }
          $oldNoUser = $env:PYTHONNOUSERSITE
          $oldPath = $env:PYTHONPATH
          try {
            $env:PYTHONNOUSERSITE = '1'
            $env:PYTHONPATH = ''
            & $env:B3_PYTHON -I -u -X faulthandler tools\beggars_scene\export_faceverse_v4_blender_sequence.py `
              --coefficients $env:B3_COEFFICIENTS `
              --faceverse-root $env:B3_SOURCE `
              --model-npy $env:B3_MODEL `
              --checkpoint $env:B3_CHECKPOINT `
              --clip $clip `
              --output-npz $sequence `
              --output-report $report `
              --anchors '21,31,35' `
              --device auto
            if ($LASTEXITCODE -ne 0) { throw "Blender v3 sequence export failed with exit code $LASTEXITCODE" }
          }
          finally {
            $env:PYTHONNOUSERSITE = $oldNoUser
            $env:PYTHONPATH = $oldPath
            Remove-Item -LiteralPath $clip -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $sequence) -or (Get-Item -LiteralPath $sequence).Length -lt 100000) {
            throw 'Blender v3 sequence is missing or implausibly small'
          }
          "B3_OUTPUT=$output" | Add-Content -LiteralPath $env:GITHUB_ENV
          "B3_SEQUENCE=$sequence" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build save reload and render groomed stills
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:B3_BLENDER `
            --background `
            --factory-startup `
            --python blender\build_beggars_meme_scene_faceverse_v3.py `
            -- `
            --sequence $env:B3_SEQUENCE `
            --config configs\scene\beggars_banquet_recreation_v1.json `
            --output-dir $env:B3_OUTPUT `
            --render-engine eevee
          if ($LASTEXITCODE -ne 0) { throw "Groomed Blender v3 preflight failed with exit code $LASTEXITCODE" }
          foreach ($name in @('beggars_photoreal_recreation.blend','hero_clean_render.png','wide_scene_proof.png','proof_frame_01.png','proof_frame_02.png','proof_frame_03.png','scene_receipt.json')) {
            $path = Join-Path $env:B3_OUTPUT $name
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Groomed Blender v3 output missing or empty: $name"
            }
          }
          Write-Host 'BLENDER_FACEVERSE_V3_SAVE_RELOAD_STILLS=PROVEN'

      - name: Build visual contact sheet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:B3_OUTPUT 'make_contact_sheet.py'
          $lines = @(
            'from pathlib import Path',
            'from PIL import Image, ImageDraw',
            'import os',
            'root = Path(os.environ["B3_OUTPUT"])',
            'names = ["proof_frame_01.png", "proof_frame_02.png", "proof_frame_03.png", "hero_clean_render.png", "wide_scene_proof.png"]',
            'images = []',
            'for name in names:',
            '    image = Image.open(root / name).convert("RGB")',
            '    image.thumbnail((640, 360), Image.Resampling.LANCZOS)',
            '    tile = Image.new("RGB", (640, 396), "black")',
            '    tile.paste(image, ((640-image.width)//2, 0))',
            '    ImageDraw.Draw(tile).text((12, 368), name, fill="white")',
            '    images.append(tile)',
            'sheet = Image.new("RGB", (1280, 1188), "black")',
            'for index, image in enumerate(images):',
            '    sheet.paste(image, ((index % 2)*640, (index // 2)*396))',
            'sheet.save(root / "contact_sheet.png", quality=94)'
          )
          [System.IO.File]::WriteAllLines($scriptPath,$lines,[System.Text.UTF8Encoding]::new($false))
          & $env:B3_PYTHON $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not build Blender v3 contact sheet' }
          $sheet = Join-Path $env:B3_OUTPUT 'contact_sheet.png'
          if (-not (Test-Path -LiteralPath $sheet) -or (Get-Item -LiteralPath $sheet).Length -lt 100000) {
            throw 'Blender v3 contact sheet is missing or implausibly small'
          }
          Remove-Item -LiteralPath $scriptPath -Force -ErrorAction SilentlyContinue

      - name: Remove private sequence cache
        if: always()
        shell: powershell
        run: |
          if ($env:B3_OUTPUT) {
            $private = Join-Path $env:B3_OUTPUT '_private'
            if (Test-Path -LiteralPath $private) { Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload groomed Blender v3 preflight
        uses: actions/upload-artifact@v4
        with:
          name: beggars-blender-faceverse-v3-preflight-${{ github.run_id }}
          path: |
            ${{ env.B3_OUTPUT }}/beggars_photoreal_recreation.blend
            ${{ env.B3_OUTPUT }}/hero_clean_render.png
            ${{ env.B3_OUTPUT }}/wide_scene_proof.png
            ${{ env.B3_OUTPUT }}/proof_frame_*.png
            ${{ env.B3_OUTPUT }}/contact_sheet.png
            ${{ env.B3_OUTPUT }}/scene_receipt.json
            ${{ env.B3_OUTPUT }}/faceverse_v2_sequence_report.json
          if-no-files-found: error
          retention-days: 7
