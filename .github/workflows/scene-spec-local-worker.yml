name: SceneSpec validation on local PC
run-name: SceneSpec proof ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/scene-pipeline-smoke-20260803
    paths:
      - .github/workflows/scene-spec-local-worker.yml
      - schemas/scene_spec_v1.schema.json
      - configs/scene/castlegrounds_scene_spec_v1.json
      - configs/scene/castlegrounds_source_mesh_v2.json
      - docs/SCENE_PIPELINE_V2_20260803.md
      - src/lowvram3d/scene_spec.py
      - src/lowvram3d/scene_spec_legacy.py
      - tests/test_scene_spec.py
      - tests/test_scene_spec_legacy.py

permissions:
  contents: write

concurrency:
  group: scene-spec-local-worker
  cancel-in-progress: true

jobs:
  validate-scene-spec:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact scene branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/scene-pipeline-smoke-20260803") {
            throw "Ref is not the dedicated scene branch"
          }
          if (@(git status --short).Count -gt 0) { throw "Checkout is dirty before validation" }
          "WORKER_HEAD=$(git rev-parse HEAD)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Resolve CPU Python
        shell: powershell
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe",
            "C:\AI\HY3D2\python_standalone\python.exe",
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $selected = $null
          foreach ($candidate in $candidates) {
            & $candidate -c "import sys; assert sys.version_info >= (3, 11); print(sys.executable)" 2>$null
            if ($LASTEXITCODE -eq 0) { $selected = $candidate; break }
          }
          if (-not $selected) { throw "No Python 3.11+ executable found" }
          "SCENE_PYTHON=$selected" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "Scene Python: $selected"

      - name: Compile scene sources
        shell: powershell
        run: |
          & $env:SCENE_PYTHON -m py_compile `
            src\lowvram3d\scene_spec.py `
            src\lowvram3d\scene_spec_legacy.py `
            tests\test_scene_spec.py `
            tests\test_scene_spec_legacy.py
          if ($LASTEXITCODE -ne 0) { throw "Scene Python compile failed" }

      - name: Parse schema and fixtures
        shell: powershell
        run: |
          & $env:SCENE_PYTHON -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['schemas/scene_spec_v1.schema.json','configs/scene/castlegrounds_scene_spec_v1.json','configs/scene/castlegrounds_source_mesh_v2.json']]; print('SCENE_JSON_PARSE=PROVEN')"
          if ($LASTEXITCODE -ne 0) { throw "Scene JSON parse failed" }

      - name: Run SceneSpec tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $env:SCENE_PYTHON -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw "Could not ensure pytest is installed" }
          & $env:SCENE_PYTHON -m pytest tests\test_scene_spec.py tests\test_scene_spec_legacy.py -q
          if ($LASTEXITCODE -ne 0) { throw "SceneSpec tests failed" }

      - name: Validate authored Castlegrounds SceneSpec
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          $evidence = Join-Path $PWD "evidence\latest-scene-spec-local-worker"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          & $env:SCENE_PYTHON -m lowvram3d.scene_spec `
            --scene-spec configs\scene\castlegrounds_scene_spec_v1.json `
            --report (Join-Path $evidence "scene_spec_validation.json")
          if ($LASTEXITCODE -ne 0) { throw "Authored Castlegrounds SceneSpec rejected" }

      - name: Migrate preserved legacy evidence
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          $evidence = Join-Path $PWD "evidence\latest-scene-spec-local-worker"
          & $env:SCENE_PYTHON -m lowvram3d.scene_spec_legacy `
            --interpretation proof\scene\20260803-image-to-scene-smoke\scene_interpretation.json `
            --geometry proof\scene\20260803-image-to-scene-smoke\geometry_spec.json `
            --selected-asset proof\scene\20260803-image-to-scene-smoke\selected_asset.json `
            --source-mesh configs\scene\castlegrounds_source_mesh_v2.json `
            --output (Join-Path $evidence "migrated_scene_spec.json") `
            --receipt (Join-Path $evidence "legacy_migration_receipt.json")
          if ($LASTEXITCODE -ne 0) { throw "Legacy SceneSpec migration failed" }
          & $env:SCENE_PYTHON -m lowvram3d.scene_spec `
            --scene-spec (Join-Path $evidence "migrated_scene_spec.json") `
            --report (Join-Path $evidence "migrated_scene_spec_validation.json")
          if ($LASTEXITCODE -ne 0) { throw "Migrated SceneSpec rejected" }

      - name: Run negative fail-closed probes
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $env:SCENE_PYTHON -c @'
          import copy
          import json
          from pathlib import Path
          from lowvram3d.scene_spec import validate_scene_spec

          source = json.loads(Path('configs/scene/castlegrounds_scene_spec_v1.json').read_text(encoding='utf-8'))
          probes = {}

          spec = copy.deepcopy(source)
          spec['populations'][0]['requires_collision'] = True
          probes['gpu_collision'] = validate_scene_spec(spec)

          spec = copy.deepcopy(source)
          spec['assets'][1]['collision'] = 'none'
          probes['gameplay_no_collision'] = validate_scene_spec(spec)

          spec = copy.deepcopy(source)
          spec['pcg']['layers'][-1]['outputs'] = ['gameplay_collision']
          probes['gpu_gameplay_output'] = validate_scene_spec(spec)

          spec = copy.deepcopy(source)
          spec['budgets']['allow_concurrent_neural_and_unreal_gpu'] = True
          probes['gpu_concurrency'] = validate_scene_spec(spec)

          required_codes = {
              'gpu_collision': 'UNSAFE_GPU_PCG',
              'gameplay_no_collision': 'UNSAFE_GAMEPLAY_PROXY',
              'gpu_gameplay_output': 'GPU_GAMEPLAY_OUTPUT',
              'gpu_concurrency': 'UNSAFE_GPU_CONCURRENCY',
          }
          summary = {}
          for name, report in probes.items():
              codes = {item['code'] for item in report['errors']}
              expected = required_codes[name]
              if report['scene_spec_valid'] or expected not in codes:
                  raise SystemExit(f'{name} did not fail closed with {expected}: {report}')
              summary[name] = {'classification': report['classification'], 'expected_code': expected, 'codes': sorted(codes)}

          Path('evidence/latest-scene-spec-local-worker/fail_closed_probes.json').write_text(
              json.dumps({'classification': 'PROVEN', 'probes': summary}, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print('SCENE_FAIL_CLOSED_PROBES=PROVEN')
          '@
          if ($LASTEXITCODE -ne 0) { throw "Fail-closed probes failed" }

      - name: Publish compact scene receipts
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-spec-local-worker"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{
            classification = if ("${{ job.status }}" -eq "success") { "PROVEN" } else { "REJECTED" }
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head_sha = "${{ github.sha }}"
            worker_head = $env:WORKER_HEAD
            gpu_work_started = $false
            neural_work_started = $false
            blender_work_started = $false
            unreal_work_started = $false
            scope = "SCENE_SPEC_AND_LEGACY_MIGRATION_CPU_ONLY"
            recorded_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content (Join-Path $evidence "workflow_receipt.json") -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/latest-scene-spec-local-worker
          if (@(git status --porcelain -- evidence/latest-scene-spec-local-worker).Count -gt 0) {
            git commit -m "evidence(scene): record SceneSpec local run ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit SceneSpec evidence" }
            git push origin HEAD:agent/scene-pipeline-smoke-20260803
            if ($LASTEXITCODE -ne 0) { throw "Could not push SceneSpec evidence" }
          }

      - name: Upload SceneSpec evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-spec-proof-${{ github.run_id }}
          path: evidence/latest-scene-spec-local-worker/*.json
          if-no-files-found: warn
          retention-days: 14
