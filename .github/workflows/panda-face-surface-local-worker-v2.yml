name: Retire duplicate panda face v2 worker
run-name: Retire duplicate panda face v2 worker ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/panda-face-registration-update-20260806
    paths:
      - .github/workflows/panda-face-surface-local-worker-v2.yml

permissions:
  contents: read

# Preserve the old group deliberately. A push of this retirement workflow
# cancels any stale v2 run that is still occupying the one Windows worker.
concurrency:
  group: panda-face-surface-local-worker-v2
  cancel-in-progress: true

jobs:
  retire-duplicate-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm v3 is the only active face worker lane
        run: |
          echo "PANDA_FACE_V2_WORKER=RETIRED"
          echo "ACTIVE_WORKER=.github/workflows/panda-face-surface-local-worker-v3.yml"
          echo "No self-hosted render work is performed by this workflow."
