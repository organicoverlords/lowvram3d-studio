name: Panda face surface ownership v2 on local worker
run-name: Panda face surface ownership v2 ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/panda-face-registration-update-20260806
    paths:
      - .github/workflows/panda-face-surface-local-worker-v2.yml
      - scripts/run-panda-face-surface-v2.ps1
      - fixtures/panda_face_source_fixture_20260806.json
      - workers/face_surface_candidate_v2.py
      - tests/test_face_surface_candidate_v2.py
      - workers/face_patch_texture.py
      - workers/build_render_comparison.py
      - blender/render_glb_diagnostic_set.py

permissions:
  contents: read

concurrency:
  group: panda-face-surface-local-worker-v2
  cancel-in-progress: true

jobs:
  build-render-package-v2:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64, lowvram3d-pc, blender52]
    timeout-minutes: 180

    steps:
      - name: Checkout exact face branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/panda-face-registration-update-20260806") {
            throw "Unexpected ref: ${{ github.ref }}"
          }
          if (@(git status --short).Count -gt 0) {
            throw "Checkout is dirty"
          }
          Write-Host "HEAD=$(git rev-parse HEAD)"

      - name: Execute authored face-surface implementation
        id: execute
        continue-on-error: true
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            "$PWD\scripts\run-panda-face-surface-v2.ps1" `
            -RunId "${{ github.run_id }}" `
            -Repository "${{ github.repository }}" `
            -Branch "${{ github.ref_name }}" `
            -HeadSha "${{ github.sha }}"
          exit $LASTEXITCODE

      - name: Upload face evidence ZIP v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-face-surface-ownership-v2-${{ github.run_id }}
          path: |
            C:\AI\LowVRAM3D-benchmarks\production\panda_face_surface_ownership_v2\${{ github.run_id }}\upload\*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce execution result after upload
        if: always()
        shell: powershell
        run: |
          $zip = "C:\AI\LowVRAM3D-benchmarks\production\panda_face_surface_ownership_v2\${{ github.run_id }}\upload\panda_face_surface_ownership_v2_${{ github.run_id }}.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Evidence ZIP is missing"
          }
          if ("${{ steps.execute.outcome }}" -ne "success") {
            throw "Face-surface v2 did not pass candidate/render gates; inspect the uploaded ZIP"
          }
          Write-Host "PANDA_FACE_SURFACE_V2=BUILT_AND_RENDERED"
          Write-Host "PANDA_FACE_VISUAL_ACCEPTANCE=USER_REVIEW_REQUIRED"
