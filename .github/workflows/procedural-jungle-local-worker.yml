name: Jungle PR 15 walking panda
run-name: Jungle visual bundle export ${{ github.run_id }}

on:
  push:
    branches:
      - feature/procedural-jungle-playable-20260804
    paths:
      - worker-triggers/procedural-jungle-direct-worker.txt

permissions:
  contents: read

jobs:
  export-visual-overhaul-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact jungle branch
        uses: actions/checkout@v4
        with:
          ref: feature/procedural-jungle-playable-20260804
          clean: true
          fetch-depth: 1

      - name: Verify exact bundle inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/procedural-jungle-playable-20260804"
          mapfile -t chunks < <(find worker-bundles/procedural-jungle-visual-overhaul -maxdepth 1 -type f -name 'chunk-*.b64' | sort)
          test "${#chunks[@]}" -eq 4
          printf '%s\n' "${chunks[@]}"
          sha256sum "${chunks[@]}"
          wc -c "${chunks[@]}"

      - name: Upload exact committed visual-overhaul bundle
        uses: actions/upload-artifact@v4
        with:
          name: jungle-visual-overhaul-bundle-${{ github.run_id }}
          path: |
            worker-bundles/procedural-jungle-visual-overhaul/chunk-*.b64
            scripts/procedural_jungle/run-procedural-jungle-local-worker.ps1
          if-no-files-found: error
          retention-days: 2
