name: Panda atlas root diagnostic on local worker
run-name: Panda atlas root diagnostic ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/panda-texture-artifact-root-fix-20260805
    paths:
      - .github/workflows/panda-atlas-root-local-worker.yml
      - workers/conservative_atlas.py
      - workers/panda_atlas_root_diagnostic.py
      - workers/build_contact_sheet.py
      - blender/render_glb_diagnostic_set.py
      - tests/test_conservative_atlas.py
      - docs/research/panda_atlas_raster_research_20260805.md

permissions:
  contents: read

concurrency:
  group: panda-atlas-root-local-worker
  cancel-in-progress: true

jobs:
  diagnose-and-render:
    if: github.repository_owner == 'organicoverlords'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - lowvram3d-pc
      - blender52
    timeout-minutes: 120

    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/panda-texture-artifact-root-fix-20260805") {
            throw "Ref is not the dedicated trusted panda diagnostic branch"
          }
          if (@(git status --short).Count -gt 0) {
            throw "Checkout is dirty before panda diagnostic"
          }
          Write-Host "HEAD=$(git rev-parse HEAD)"

      - name: Resolve bounded Python and Blender environments
        shell: powershell
        run: |
          $pythonCandidates = @(
            "C:\AI\HY3D2\python_standalone\python.exe",
            "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe",
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $python = $null
          foreach ($candidate in $pythonCandidates) {
            & $candidate -c "import numpy, PIL; print('PANDA_DIAG_PYTHON_OK')" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $python = $candidate
              break
            }
          }
          if (-not $python) {
            throw "No Python environment with numpy and Pillow was found"
          }

          $blenderCandidates = @(
            "C:\Program Files\Blender Foundation\Blender 5.2\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 5.1\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 5.0\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 4.5\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 4.3\blender.exe",
            "C:\Program Files\Blender Foundation\Blender 4.2\blender.exe",
            (Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $blender = $blenderCandidates | Select-Object -First 1
          if (-not $blender) {
            throw "Blender executable was not found"
          }

          $root = "C:\AI\LowVRAM3D-benchmarks\production\panda_atlas_root_local_worker\${{ github.run_id }}"
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "upload") -Force | Out-Null

          $canonicalMeshPrimary = "C:\AI\LowVRAM3D-benchmarks\miniturbo-3step-experiment-20260803\tactical_red_panda_scout\pipeline_v2_injective_20260804\state\UV\proven\tactical_red_panda_scout_rewrapped.glb"
          $canonicalMeshCandidates = @(
            $canonicalMeshPrimary,
            "C:\AI\LowVRAM3D-benchmarks\miniturbo-3step-experiment-20260803\tactical_red_panda_scout\panda_injective_rewrap_20260804\tactical_red_panda_scout_rewrapped.glb"
          )
          $benchmarkRoot = "C:\AI\LowVRAM3D-benchmarks"
          if (Test-Path -LiteralPath $benchmarkRoot -PathType Container) {
            $canonicalMeshCandidates += @(
              Get-ChildItem -LiteralPath $benchmarkRoot -Recurse -File -Filter "tactical_red_panda_scout_rewrapped.glb" -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            )
          }
          $canonicalMeshCandidates = @($canonicalMeshCandidates | Select-Object -Unique) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $canonicalMesh = $canonicalMeshCandidates | Where-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash -eq "950343DD7FF76877CE6ADB83D6D4A80A8D123E7AAFB397B566A762D454A9A5F1"
          } | Select-Object -First 1
          if (-not $canonicalMesh) { $canonicalMesh = $canonicalMeshPrimary }
          "PANDA_DIAG_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PANDA_DIAG_BLENDER=$blender" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PANDA_DIAG_ROOT=$root" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PANDA_CANONICAL_MESH=$canonicalMesh" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PANDA_HIGHRES_SOURCE=C:\AI\LowVRAM3D-benchmarks\images\red_panda_character.png" | Add-Content -LiteralPath $env:GITHUB_ENV

          Write-Host "Python: $python"
          & $python --version
          Write-Host "Blender: $blender"
          & $blender --version | Select-Object -First 2

      - name: Verify immutable local inputs
        shell: powershell
        run: |
          foreach ($path in @($env:PANDA_CANONICAL_MESH, $env:PANDA_HIGHRES_SOURCE)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required panda input is missing: $path"
            }
          }
          $meshHash = (Get-FileHash -LiteralPath $env:PANDA_CANONICAL_MESH -Algorithm SHA256).Hash
          $sourceHash = (Get-FileHash -LiteralPath $env:PANDA_HIGHRES_SOURCE -Algorithm SHA256).Hash
          if ($meshHash -ne "950343DD7FF76877CE6ADB83D6D4A80A8D123E7AAFB397B566A762D454A9A5F1") {
            throw "Canonical panda mesh hash changed: $meshHash"
          }
          if ($sourceHash -ne "FBDA3719B42366477F77E94D87CB1D32A5BF6ADC4B6F29782194CC154471159B") {
            throw "Authoritative high-resolution source hash changed: $sourceHash"
          }
          Write-Host "PANDA_CANONICAL_MESH_HASH=PROVEN"
          Write-Host "PANDA_HIGHRES_SOURCE_HASH=PROVEN"

      - name: Compile and run focused synthetic tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\workers;$PWD"
          & $env:PANDA_DIAG_PYTHON -m py_compile `
            workers\conservative_atlas.py `
            workers\panda_atlas_root_diagnostic.py `
            workers\build_contact_sheet.py
          if ($LASTEXITCODE -ne 0) {
            throw "Panda diagnostic Python compilation failed"
          }
          & $env:PANDA_DIAG_PYTHON -c "import pytest" 2>$null
          if ($LASTEXITCODE -ne 0) {
            & $env:PANDA_DIAG_PYTHON -m pip install --disable-pip-version-check pytest
            if ($LASTEXITCODE -ne 0) {
              throw "Could not ensure pytest is installed"
            }
          }
          & $env:PANDA_DIAG_PYTHON -m pytest tests\test_conservative_atlas.py -q
          if ($LASTEXITCODE -ne 0) {
            throw "Conservative atlas synthetic tests failed"
          }

      - name: Audit canonical panda atlas support
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\workers;$PWD"
          $out = Join-Path $env:PANDA_DIAG_ROOT "atlas_audit"
          & $env:PANDA_DIAG_PYTHON workers\panda_atlas_root_diagnostic.py `
            --mesh $env:PANDA_CANONICAL_MESH `
            --out-dir $out `
            --sizes 512 1024
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical panda atlas audit failed"
          }

      - name: Build chart-safe conservative support contract
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\workers;$PWD"
          $contractOut = Join-Path $env:PANDA_DIAG_ROOT "atlas_contract_1024"
          & $env:PANDA_DIAG_PYTHON workers\panda_atlas_root_diagnostic.py `
            --mesh $env:PANDA_CANONICAL_MESH `
            --out-dir $contractOut `
            --sizes 1024 `
            --write-support-contract
          if ($LASTEXITCODE -ne 0) {
            throw "Conservative support contract failed"
          }

      - name: Render synthetic support-class contract
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\workers;$PWD"
          $contractGlb = Join-Path $env:PANDA_DIAG_ROOT "atlas_contract_1024\atlas_1024\support_class.glb"
          $renderDir = Join-Path $env:PANDA_DIAG_ROOT "atlas_contract_1024\renders"
          New-Item -ItemType Directory -Path $renderDir -Force | Out-Null
          if (-not (Test-Path -LiteralPath $contractGlb -PathType Leaf)) { throw "Synthetic support GLB missing" }
          & $env:PANDA_DIAG_BLENDER --background --factory-startup --python "$PWD\blender\render_glb_diagnostic_set.py" -- --input $contractGlb --out-dir $renderDir --label support_class --resolution 256 *> (Join-Path $renderDir "blender.log")
          if ($LASTEXITCODE -ne 0) { throw "Synthetic support render failed" }
          & $env:PANDA_DIAG_PYTHON workers\build_contact_sheet.py --render-dir $renderDir --output (Join-Path $renderDir "contact_sheet.png") *>> (Join-Path $renderDir "blender.log")
          if ($LASTEXITCODE -ne 0) { throw "Synthetic support contact sheet failed" }
          $env:PANDA_DIAG_PYTHON -c "from pathlib import Path; from PIL import Image; import json; root=Path(r'$renderDir'); files=sorted(root.glob('*.png')); result={'rendered_images':len(files),'visible_magenta_pixels':sum(int((__import__('numpy').asarray(Image.open(p).convert('RGB'))==[220,0,220]).all(2).sum()) for p in files if p.name!='contact_sheet.png'),'visible_black_default_pixels':sum(int((__import__('numpy').asarray(Image.open(p).convert('RGB'))==[0,0,0]).all(2).sum()) for p in files if p.name!='contact_sheet.png')}; (root/'render_manifest.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result))"

      - name: Resolve selected existing visual candidates
        shell: powershell
        run: |
          $candidates = @()
          $known = @(
            [ordered]@{
              label = "chart_local_harmonization"
              path = "C:\AI\panda_diag_neutral_v1\chart_local_harmonization_diagnostic_only\chart_local_harmonization_canonical_mesh_diagnostic_only.glb"
            },
            [ordered]@{
              label = "surface_space_completion"
              path = "C:\AI\panda_diag_neutral_v1\surface_space_completion_diagnostic_only\surface_space_completion_diagnostic_only.glb"
            },
            [ordered]@{
              label = "bottom_surface_correction"
              path = "C:\AI\panda_diag_neutral_v1\bottom_surface_correction_diagnostic_only\bottom_surface_correction_diagnostic_only.glb"
            }
          )
          foreach ($candidate in $known) {
            if (Test-Path -LiteralPath $candidate.path -PathType Leaf) {
              $candidates += $candidate
            } else {
              Write-Warning "Visual candidate missing: $($candidate.path)"
            }
          }

          $highresDir = "C:\AI\LowVRAM3D-benchmarks\production\per_texel_evidence_compiler_validation\panda_original_highres_authority_20260805\projection\diagnostic_2048_exact1024_original_boundary_background_gate"
          if (Test-Path -LiteralPath $highresDir -PathType Container) {
            $highres = Get-ChildItem -LiteralPath $highresDir -File -Filter *.glb | Sort-Object Name | Select-Object -First 1
            if ($highres) {
              $candidates += [ordered]@{ label = "highres_exact_2048_rejected"; path = $highres.FullName }
            }
          }
          if ($candidates.Count -eq 0) {
            Write-Warning "No existing panda visual candidate was found; packaging partial evidence only"
          }
          $candidatePath = Join-Path $env:PANDA_DIAG_ROOT "visual_candidates.json"
          ConvertTo-Json -InputObject @($candidates) -Depth 4 | Set-Content -LiteralPath $candidatePath -Encoding utf8
          Get-Content -LiteralPath $candidatePath

      - name: Fresh-render selected GLBs and build contact sheets
        shell: powershell
        run: |
          $candidates = [System.Collections.Generic.List[object]]::new()
          $candidateManifest = Join-Path $env:PANDA_DIAG_ROOT "visual_candidates.json"
          if (Test-Path -LiteralPath $candidateManifest -PathType Leaf) {
            $document = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $candidateManifest -Raw)
            # PowerShell 5.1 unwraps a one-element JSON array into a scalar
            # PSCustomObject.  The explicit array subexpression preserves the
            # entry boundary for both one and many candidates.
            $entries = @($document)
            # Compatibility marker: foreach ($entry in $document) is unsafe for
            # a scalar in Windows PowerShell 5.1; iterate the flattened array.
            foreach ($entry in $entries) { [void]$candidates.Add($entry) }
          } else {
            Write-Warning "Candidate manifest is unavailable; packaging partial evidence only"
          }
          $renderRoot = Join-Path $env:PANDA_DIAG_ROOT "fresh_renders"
          New-Item -ItemType Directory -Path $renderRoot -Force | Out-Null
          $matrix = [System.Collections.Generic.List[object]]::new()
          function Read-ScalarManifestValue([object]$entry, [string]$name) {
            if ($null -eq $entry) { throw "Candidate entry is null" }
            $property = $entry.PSObject.Properties[$name]
            if ($null -eq $property) { throw "Candidate field '$name' is missing" }
            $value = $property.Value
            if ($null -eq $value -or ($value -is [System.Array]) -or (($value -is [System.Collections.IEnumerable]) -and -not ($value -is [string]))) {
              throw "Candidate field '$name' must be scalar"
            }
            $text = [string]$value
            if ([string]::IsNullOrWhiteSpace($text)) { throw "Candidate field '$name' is empty" }
            return $text.Trim()
          }
          $candidateIndex = 0
          foreach ($candidate in $candidates) {
            $label = $null
            $inputPath = $null
            # Legacy scalar forms (`$label = [string]$candidate.label`,
            # `$inputPath = [string]$candidate.path`) are intentionally
            # replaced by Read-ScalarManifestValue so arrays cannot stringify.
            $status = "RENDER_FAILED"
            $exitCode = 1
            try {
              $label = Read-ScalarManifestValue $candidate "label"
              $inputPath = Read-ScalarManifestValue $candidate "path"
              if ($label -match '[\\/:*?"<>|]') { throw "Candidate label contains path/control characters" }
            } catch {
              $label = "candidate_{0:D3}" -f $candidateIndex
              $out = Join-Path -Path $renderRoot -ChildPath $label
              New-Item -ItemType Directory -Path $out -Force | Out-Null
              $errorText = $_.Exception.Message
              $errorText | Set-Content -LiteralPath (Join-Path $out "blender.log") -Encoding utf8
              [ordered]@{ label = $label; input_path = $inputPath; render_status = "RENDER_FAILED"; blender_exit_code = 1; completed_at_utc = (Get-Date).ToUniversalTime().ToString("o"); error_summary = "Invalid candidate manifest: $errorText" } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out "candidate_render_receipt.json") -Encoding utf8
              [void]$matrix.Add([ordered]@{ label = $label; input_path = $inputPath; input_sha256 = $null; blender_exit_code = 1; expected_image_count = 9; produced_image_count = 0; contact_sheet_exists = $false; render_status = "RENDER_FAILED"; error_summary = "Invalid candidate manifest: $errorText" })
              $candidateIndex++
              continue
            }
            $out = Join-Path -Path $renderRoot -ChildPath $label
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            $start = [ordered]@{ label = $label; input_path = $inputPath; started_at_utc = (Get-Date).ToUniversalTime().ToString("o") }
            $start | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out "candidate_start_receipt.json") -Encoding utf8
            $renderLog = Join-Path $out "blender.log"
            $contact = Join-Path $out "contact_sheet.png"
            if (-not (Test-Path -LiteralPath $inputPath -PathType Leaf)) {
              $status = "INPUT_MISSING"
              "Missing candidate input: $inputPath" | Set-Content -LiteralPath $renderLog -Encoding utf8
            } else {
              & $env:PANDA_DIAG_BLENDER --background --factory-startup --python "$PWD\blender\render_glb_diagnostic_set.py" -- --input $inputPath --out-dir $out --label $label --resolution 768 *> $renderLog
              $exitCode = $LASTEXITCODE
              $expected = @("01_front.png","02_front_left.png","03_left.png","04_rear_left.png","05_rear.png","06_rear_right.png","07_right.png","08_front_right.png","09_bottom.png")
              $produced = @($expected | Where-Object { Test-Path -LiteralPath (Join-Path $out $_) })
              if ($exitCode -eq 0 -and $produced.Count -eq $expected.Count) {
                & $env:PANDA_DIAG_PYTHON workers\build_contact_sheet.py --render-dir $out --output $contact *>> $renderLog
                if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $contact -PathType Leaf)) { $status = "RENDERED" } else { $status = "CONTACT_SHEET_FAILED" }
              }
            }
            [ordered]@{ label = $label; input_path = $inputPath; input_sha256 = if (Test-Path -LiteralPath $inputPath) { (Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash.ToLower() } else { $null }; blender_exit_code = $exitCode; expected_image_count = 9; produced_image_count = @((Get-ChildItem -LiteralPath $out -Filter '*.png' -File -ErrorAction SilentlyContinue)).Count; contact_sheet_exists = (Test-Path -LiteralPath $contact -PathType Leaf); render_status = $status; error_summary = if ($status -eq "RENDERED") { $null } else { "See $renderLog" } } | ForEach-Object { [void]$matrix.Add($_) }
            [ordered]@{ label = $label; render_status = $status; blender_exit_code = $exitCode; completed_at_utc = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out "candidate_render_receipt.json") -Encoding utf8
            $candidateIndex++
          }
          ConvertTo-Json -InputObject @($matrix) -Depth 6 | Set-Content -LiteralPath (Join-Path $env:PANDA_DIAG_ROOT "fresh_renders\render_matrix.json") -Encoding utf8

      - name: Package panda atlas support ZIP
        if: always()
        shell: powershell
        run: |
          $diagRoot = $env:PANDA_DIAG_ROOT
          if ([string]::IsNullOrWhiteSpace($diagRoot)) {
            $diagRoot = "C:\AI\LowVRAM3D-benchmarks\production\panda_atlas_root_local_worker\${{ github.run_id }}"
          }
          "PANDA_DIAG_ROOT=$diagRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $diagRoot -Force | Out-Null
          $package = Join-Path $diagRoot "package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          function Copy-IfPresent([string]$source, [string]$destination) { if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $destination -Recurse -Force } }
          foreach ($name in @("atlas_audit","atlas_contract_1024","fresh_renders","render_logs","tests")) { Copy-IfPresent (Join-Path $diagRoot $name) (Join-Path $package $name) }
          Copy-IfPresent (Join-Path $diagRoot "visual_candidates.json") (Join-Path $package "visual_candidates.json")
          Copy-IfPresent (Join-Path $diagRoot "fresh_renders\render_matrix.json") (Join-Path $package "render_matrix.json")
          Copy-IfPresent $env:PANDA_HIGHRES_SOURCE (Join-Path $package "authoritative_highres_source.png")
          Copy-IfPresent $env:PANDA_CANONICAL_MESH (Join-Path $package "canonical_mesh.glb")
          Copy-IfPresent "docs\research\panda_atlas_raster_research_20260805.md" (Join-Path $package "final_report.md")
          Copy-IfPresent "docs\evidence\panda_atlas_support_fix_20260806.md" (Join-Path $package "support_fix_report.md")

          $candidates = [System.Collections.Generic.List[object]]::new()
          $candidateManifest = Join-Path $diagRoot "visual_candidates.json"
          if (Test-Path -LiteralPath $candidateManifest -PathType Leaf) {
            $document = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $candidateManifest -Raw)
            # Keep one-element manifests enumerable under Windows PowerShell 5.1.
            $entries = @($document)
            # Compatibility marker: foreach ($entry in $document) must be
            # replaced by the flattened array above for scalar JSON objects.
            foreach ($entry in $entries) { [void]$candidates.Add($entry) }
          }
          function Read-ScalarManifestValue([object]$entry, [string]$name) {
            if ($null -eq $entry) { throw "Candidate entry is null" }
            $property = $entry.PSObject.Properties[$name]
            if ($null -eq $property) { throw "Candidate field '$name' is missing" }
            $value = $property.Value
            if ($null -eq $value -or ($value -is [System.Array]) -or (($value -is [System.Collections.IEnumerable]) -and -not ($value -is [string]))) { throw "Candidate field '$name' must be scalar" }
            $text = [string]$value
            if ([string]::IsNullOrWhiteSpace($text)) { throw "Candidate field '$name' is empty" }
            return $text.Trim()
          }
          $inputs = @()
          foreach ($base in @(
            [ordered]@{ role = "canonical_mesh"; path = $env:PANDA_CANONICAL_MESH },
            [ordered]@{ role = "authoritative_highres_source"; path = $env:PANDA_HIGHRES_SOURCE }
          )) {
            $baseHash = $null
            if (-not [string]::IsNullOrWhiteSpace([string]$base.path) -and (Test-Path -LiteralPath $base.path -PathType Leaf)) { $baseHash = (Get-FileHash -LiteralPath $base.path -Algorithm SHA256).Hash.ToLower() }
            $inputs += [ordered]@{ role = $base.role; path = $base.path; sha256 = $baseHash }
          }
          foreach ($candidate in $candidates) {
            try { $candidateLabel = Read-ScalarManifestValue $candidate "label" } catch { $candidateLabel = "invalid_candidate" }
            try { $candidatePath = Read-ScalarManifestValue $candidate "path" } catch { $candidatePath = $null }
            $inputs += [ordered]@{
              role = $candidateLabel
              path = $candidatePath
              sha256 = if (-not [string]::IsNullOrWhiteSpace($candidatePath) -and (Test-Path -LiteralPath $candidatePath -PathType Leaf)) { (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLower() } else { $null }
            }
          }
          ConvertTo-Json -InputObject @($inputs) -Depth 5 | Set-Content -LiteralPath (Join-Path $package "input_hashes.json") -Encoding utf8

          $gpu = "not_available"
          $nvidia = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if ($nvidia) {
            $gpu = (& $nvidia.Source --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>&1) -join "`n"
          }
          [ordered]@{
            schema = "panda_atlas_root_local_worker_receipt_v1"
            repository = "${{ github.repository }}"
            branch = "${{ github.ref_name }}"
            head_sha = "${{ github.sha }}"
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            python = if (-not [string]::IsNullOrWhiteSpace($env:PANDA_DIAG_PYTHON)) { (& $env:PANDA_DIAG_PYTHON --version 2>&1) -join " " } else { "unavailable" }
            blender = if (-not [string]::IsNullOrWhiteSpace($env:PANDA_DIAG_BLENDER)) { (& $env:PANDA_DIAG_BLENDER --version 2>&1 | Select-Object -First 1) -join " " } else { "unavailable" }
            gpu = $gpu
            classification = "DIAGNOSTIC_ONLY_NOT_PRODUCTION_READY"
            production_asset_written = $false
            golden_overwritten = $false
            generated_views_regenerated = $false
            uv_or_geometry_regenerated = $false
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $package "worker_receipt.json") -Encoding utf8

          Get-ChildItem -LiteralPath $package -File -Recurse | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = $_.FullName.Substring($package.Length).TrimStart("\", "/").Replace("\", "/")
            "$hash  $relative"
          } | Sort-Object | Set-Content -LiteralPath (Join-Path $package "SHA256SUMS.txt") -Encoding ascii

          $upload = Join-Path $diagRoot "upload"
          $zip = Join-Path $upload "panda_atlas_support_fix_${{ github.run_id }}.zip"
          Compress-Archive -LiteralPath $package -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -LiteralPath (Join-Path $upload "ZIP_SHA256SUMS.txt") -Encoding ascii
          Copy-Item -LiteralPath (Join-Path $package "worker_receipt.json") -Destination $upload -Force
          Copy-IfPresent (Join-Path $diagRoot "atlas_audit\diagnostic_bundle.json") (Join-Path $upload "diagnostic_bundle.json")
          Write-Host "PANDA_SUPPORT_ZIP=$zip"
          Write-Host "PANDA_SUPPORT_ZIP_SHA256=$zipHash"

      - name: Verify package preparation
        if: always()
        shell: powershell
        run: |
          $upload = Join-Path $env:PANDA_DIAG_ROOT "upload"
          $zip = Get-ChildItem -LiteralPath $upload -Filter "panda_atlas_support_fix_*.zip" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $sum = Join-Path $upload "ZIP_SHA256SUMS.txt"
          if (-not $zip -or -not (Test-Path -LiteralPath $sum -PathType Leaf) -or $zip.Length -le 0) {
            throw "Panda support ZIP preparation failed"
          }
          Write-Host "PANDA_SUPPORT_PACKAGE_READY=$($zip.FullName)"

      - name: Upload panda diagnostic ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-atlas-support-fix-${{ github.run_id }}
          path: |
            C:\AI\LowVRAM3D-benchmarks\production\panda_atlas_root_local_worker\${{ github.run_id }}\upload\*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
