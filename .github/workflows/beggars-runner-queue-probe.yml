name: Beggars runner queue probe
run-name: Beggars runner queue probe ${{ github.run_id }}

on:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - evidence/runner-queue-probe-trigger.json

permissions:
  actions: read
  contents: write

jobs:
  inspect-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect active workflow jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'beggars-runner-queue-probe',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          runs = []
          for status in ('in_progress', 'queued', 'waiting', 'pending'):
              result = get(f'{api}/actions/runs?status={status}&per_page=100')
              for run in result.get('workflow_runs', []):
                  run['_queried_status'] = status
                  runs.append(run)

          unique = {run['id']: run for run in runs}
          rows = []
          for run in sorted(unique.values(), key=lambda item: item['id'], reverse=True):
              jobs_result = get(f"{api}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100")
              jobs = []
              for job in jobs_result.get('jobs', []):
                  jobs.append({
                      'id': job['id'],
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job['conclusion'],
                      'runner_name': job.get('runner_name'),
                      'runner_group_name': job.get('runner_group_name'),
                      'labels': job.get('labels', []),
                      'started_at': job.get('started_at'),
                      'completed_at': job.get('completed_at'),
                      'steps': [
                          {
                              'number': step['number'],
                              'name': step['name'],
                              'status': step['status'],
                              'conclusion': step['conclusion'],
                          }
                          for step in job.get('steps', [])
                      ],
                  })
              rows.append({
                  'run_id': run['id'],
                  'name': run['name'],
                  'path': run['path'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'head_branch': run['head_branch'],
                  'url': run['html_url'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'jobs': jobs,
              })

          payload = {
              'classification': 'QUEUE_CENSUS_PROVEN',
              'observed_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'active_run_count': len(rows),
              'runs': rows,
          }
          evidence = Path('evidence/latest-beggars-runner-queue-probe')
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'queue-census.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Publish queue census
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/latest-beggars-runner-queue-probe/queue-census.json
          git commit -m "evidence(scene): record runner queue census ${{ github.run_id }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then
              exit 0
            fi
            sleep 2
          done
          exit 1
