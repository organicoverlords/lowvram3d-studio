name: Beggars Blender FaceVerse v2 preflight
run-name: Beggars Blender FaceVerse v2 preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - tools/beggars_scene/export_faceverse_v4_blender_sequence.py
      - blender/build_beggars_meme_scene_faceverse_v2.py
      - .github/workflows/beggars-blender-faceverse-v2-preflight.yml

permissions:
  contents: write

concurrency:
  group: beggars-blender-faceverse-v2-preflight
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact run identity
        run: |
          set -euo pipefail
          evidence='evidence/latest-beggars-blender-faceverse-v2-preflight'
          mkdir -p "$evidence"
          jq -n \
            --argjson run_id '${{ github.run_id }}' \
            --arg head_sha '${{ github.sha }}' \
            --arg branch '${{ github.ref_name }}' \
            --arg url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{classification:"RUN_REGISTERED",workflow_run_id:$run_id,status:"in_progress",conclusion:null,head_sha:$head_sha,head_branch:$branch,url:$url}' \
            > "$evidence/run-registration.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence/run-registration.json"
          git commit -m 'evidence(scene): register groomed Blender preflight ${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then exit 0; fi
            test "$attempt" -lt 4
            sleep 2
          done

  build-and-render:
    needs: register
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout exact groomed Blender source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify optimized fit, FaceVerse runtime and Blender
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\AI\LowVRAM3D-cache\faceverse-v4\venv-py39-cu118\Scripts\python.exe'
          $source = 'C:\AI\LowVRAM3D-cache\faceverse-v4\source-19c67cc4d7234b1ea7d55a185a2cb55fd49bb877'
          $model = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_v4_2.npy'
          $checkpoint = 'C:\AI\LowVRAM3D-cache\faceverse-v4\models\faceverse_resnet50.pth'
          $coefficients = 'C:\AI\LowVRAM3D-benchmarks\beggars-scene\faceverse-shared-identity-fit-v2-30875541045\faceverse_shared_identity_fit_coefficients.npz'
          $blender = 'C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'
          foreach ($required in @($python, $source, $model, $checkpoint, $coefficients, $blender)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Blender preflight input missing: $required" }
          }
          $gpuLine = (& nvidia-smi --query-compute-apps=used_memory --format=csv,noheader,nounits 2>$null | Out-String).Trim()
          $gpuUsed = 0
          if ($gpuLine) {
            foreach ($line in $gpuLine -split "`r?`n") {
              $value = 0
              if ([int]::TryParse($line.Trim(), [ref]$value)) { $gpuUsed += $value }
            }
          }
          Write-Host "GPU_USED_MIB=$gpuUsed"
          if ($gpuUsed -ge 4800) { throw "GPU_BUSY: $gpuUsed MiB" }
          & $python -I -u -X faulthandler -c "import torch; assert torch.__version__.startswith('2.5.1'), torch.__version__; assert torch.cuda.is_available(); print('FACEVERSE_BLENDER_EXPORT_RUNTIME=PROVEN',torch.__version__,torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) { throw 'FaceVerse Blender-export runtime validation failed' }
          & $python -m py_compile tools\beggars_scene\export_faceverse_v4_blender_sequence.py
          if ($LASTEXITCODE -ne 0) { throw 'FaceVerse Blender sequence exporter failed compilation' }
          "BLENDER_PREFLIGHT_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_MODEL=$model" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_CHECKPOINT=$checkpoint" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_COEFFICIENTS=$coefficients" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_EXE=$blender" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Export corrected three-key FaceVerse sequence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "C:\AI\LowVRAM3D-benchmarks\beggars-scene\blender-faceverse-v2-preflight-${{ github.run_id }}"
          $private = Join-Path $output '_private'
          $clip = Join-Path $private 'public_reference.mp4'
          $sequence = Join-Path $private 'faceverse_v2_sequence.npz'
          $report = Join-Path $output 'faceverse_v2_sequence_report.json'
          New-Item -ItemType Directory -Path $private -Force | Out-Null
          curl.exe -L --fail --retry 3 --retry-delay 2 --output $clip 'https://media.tenor.com/e8wT4qAP6zwAAAPo/somebody-get-these-beggars-out-of-here-the-odyssey.mp4'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $clip)) { throw 'Could not download public reference clip' }
          $previousNoUser = $env:PYTHONNOUSERSITE
          $previousPath = $env:PYTHONPATH
          try {
            $env:PYTHONNOUSERSITE = '1'
            $env:PYTHONPATH = ''
            & $env:BLENDER_PREFLIGHT_PYTHON -I -u -X faulthandler tools\beggars_scene\export_faceverse_v4_blender_sequence.py `
              --coefficients $env:BLENDER_PREFLIGHT_COEFFICIENTS `
              --faceverse-root $env:BLENDER_PREFLIGHT_SOURCE `
              --model-npy $env:BLENDER_PREFLIGHT_MODEL `
              --checkpoint $env:BLENDER_PREFLIGHT_CHECKPOINT `
              --clip $clip `
              --output-npz $sequence `
              --output-report $report `
              --anchors '21,31,35' `
              --device auto
            if ($LASTEXITCODE -ne 0) { throw "FaceVerse Blender sequence export failed with exit code $LASTEXITCODE" }
          }
          finally {
            $env:PYTHONNOUSERSITE = $previousNoUser
            $env:PYTHONPATH = $previousPath
            Remove-Item -LiteralPath $clip -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $sequence) -or (Get-Item -LiteralPath $sequence).Length -lt 1000000) {
            throw 'FaceVerse Blender sequence is missing or implausibly small'
          }
          "BLENDER_PREFLIGHT_OUTPUT=$output" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BLENDER_PREFLIGHT_SEQUENCE=$sequence" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build, save, reload and render groomed Blender stills
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_PREFLIGHT_EXE `
            --background `
            --factory-startup `
            --python blender\build_beggars_meme_scene_faceverse_v2.py `
            -- `
            --sequence $env:BLENDER_PREFLIGHT_SEQUENCE `
            --config configs\scene\beggars_banquet_recreation_v1.json `
            --output-dir $env:BLENDER_PREFLIGHT_OUTPUT `
            --render-engine eevee
          if ($LASTEXITCODE -ne 0) { throw "Groomed Blender preflight failed with exit code $LASTEXITCODE" }
          foreach ($name in @(
            'beggars_photoreal_recreation.blend',
            'hero_clean_render.png',
            'wide_scene_proof.png',
            'proof_frame_01.png',
            'proof_frame_02.png',
            'proof_frame_03.png',
            'scene_receipt.json'
          )) {
            $path = Join-Path $env:BLENDER_PREFLIGHT_OUTPUT $name
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Groomed Blender proof output missing or empty: $name"
            }
          }
          Write-Host 'BLENDER_FACEVERSE_V2_SAVE_RELOAD_STILLS=PROVEN'

      - name: Build clean visual contact sheet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
from pathlib import Path
from PIL import Image, ImageDraw
import os
root = Path(os.environ['BLENDER_PREFLIGHT_OUTPUT'])
names = ['proof_frame_01.png','proof_frame_02.png','proof_frame_03.png','hero_clean_render.png','wide_scene_proof.png']
images = []
for name in names:
    image = Image.open(root / name).convert('RGB')
    image.thumbnail((640, 360), Image.Resampling.LANCZOS)
    tile = Image.new('RGB', (640, 396), 'black')
    tile.paste(image, ((640-image.width)//2, 0))
    draw = ImageDraw.Draw(tile)
    draw.text((12, 368), name, fill='white')
    images.append(tile)
sheet = Image.new('RGB', (1280, 1188), 'black')
for index, image in enumerate(images):
    sheet.paste(image, ((index % 2) * 640, (index // 2) * 396))
sheet.save(root / 'contact_sheet.png', quality=94)
'@
          & $env:BLENDER_PREFLIGHT_PYTHON -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Could not build Blender visual contact sheet' }
          $sheet = Join-Path $env:BLENDER_PREFLIGHT_OUTPUT 'contact_sheet.png'
          if (-not (Test-Path -LiteralPath $sheet) -or (Get-Item -LiteralPath $sheet).Length -lt 100000) {
            throw 'Blender contact sheet is missing or implausibly small'
          }

      - name: Remove private sequence cache
        if: always()
        shell: powershell
        run: |
          $private = Join-Path $env:BLENDER_PREFLIGHT_OUTPUT '_private'
          if (Test-Path -LiteralPath $private) {
            Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload groomed Blender preflight
        uses: actions/upload-artifact@v4
        with:
          name: beggars-blender-faceverse-v2-preflight-${{ github.run_id }}
          path: |
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/beggars_photoreal_recreation.blend
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/hero_clean_render.png
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/wide_scene_proof.png
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/proof_frame_*.png
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/contact_sheet.png
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/scene_receipt.json
            ${{ env.BLENDER_PREFLIGHT_OUTPUT }}/faceverse_v2_sequence_report.json
          if-no-files-found: error
          retention-days: 7
