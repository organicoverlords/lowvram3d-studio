name: Beggars canonical face diagnostic
run-name: Beggars canonical face diagnostic ${{ github.run_id }}

# visual-retry: 2026-08-04T03:12:00+03:00

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - tools/beggars_scene/build_canonical_face_sequence.py
      - blender/diagnose_beggars_canonical_face.py
      - .github/workflows/beggars-canonical-face-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: beggars-canonical-face-diagnostic
  cancel-in-progress: true

jobs:
  render-canonical-face-variants:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Ensure reconstruction runtime
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\ensure-beggars-v2-runtime.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime bootstrap failed with exit code $LASTEXITCODE"
          }

      - name: Build canonical pose-decoupled sequence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = 'C:\AI\LowVRAM3D-benchmarks\beggars-scene\run-30863735416\_reference_private'
          $input = Join-Path $sourceRoot 'face_sequence.npz'
          $thirdParty = Join-Path $sourceRoot '3DDFA_V2'
          $bfm = Join-Path $thirdParty 'configs\bfm_noneck_v3.pkl'
          $output = "C:\AI\LowVRAM3D-benchmarks\beggars-scene\canonical-diagnostic-${{ github.run_id }}"
          $canonical = Join-Path $output 'canonical_face_sequence.npz'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($required in @($input, $thirdParty, $bfm)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Canonical diagnostic input is missing: $required"
            }
          }
          $python = 'C:\AI\LowVRAM3D-cache\beggars-scene-v2\venv\Scripts\python.exe'
          & $python tools\beggars_scene\build_canonical_face_sequence.py `
            --input-npz $input `
            --third-party-root $thirdParty `
            --bfm-pkl $bfm `
            --output-npz $canonical `
            --output-report (Join-Path $output 'canonical_report.json')
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical sequence build failed with exit code $LASTEXITCODE"
          }
          "CANONICAL_DIAGNOSTIC_OUTPUT=$output" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CANONICAL_SEQUENCE=$canonical" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Render canonical face variants
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $blender = 'C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'
          & $blender --background --factory-startup `
            --python blender\diagnose_beggars_canonical_face.py `
            -- `
            --sequence $env:CANONICAL_SEQUENCE `
            --output-dir $env:CANONICAL_DIAGNOSTIC_OUTPUT
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical Blender diagnostic failed with exit code $LASTEXITCODE"
          }

      - name: Commit compact canonical diagnostic receipts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'evidence\latest-beggars-canonical-diagnostic'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CANONICAL_DIAGNOSTIC_OUTPUT 'diagnostic.json') -Destination (Join-Path $evidence 'diagnostic.json') -Force
          Copy-Item -LiteralPath (Join-Path $env:CANONICAL_DIAGNOSTIC_OUTPUT 'canonical_report.json') -Destination (Join-Path $evidence 'canonical_report.json') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $evidence
          git commit -m "evidence(scene): record canonical face diagnostic ${{ github.run_id }}"
          git pull --rebase origin agent/blender-beggars-scene-20260804
          git push origin HEAD:agent/blender-beggars-scene-20260804

      - name: Upload canonical diagnostic renders
        uses: actions/upload-artifact@v4
        with:
          name: beggars-canonical-diagnostic-${{ github.run_id }}
          path: |
            ${{ env.CANONICAL_DIAGNOSTIC_OUTPUT }}/*.png
            ${{ env.CANONICAL_DIAGNOSTIC_OUTPUT }}/*.json
          if-no-files-found: error
          retention-days: 14
