name: Beggars canonical face diagnostic
run-name: Beggars canonical face diagnostic ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - scripts/run-beggars-canonical-diagnostic.ps1
      - scripts/apply-beggars-canonical-runtime-compat.ps1
      - scripts/apply-beggars-canonical-v3-import-compat.ps1
      - scripts/apply-beggars-canonical-v3-runner.ps1
      - tools/beggars_scene/build_canonical_face_sequence.py
      - blender/diagnose_beggars_canonical_face.py
      - blender/diagnose_beggars_canonical_face_v2.py
      - blender/diagnose_beggars_canonical_face_v3.py
      - .github/workflows/beggars-canonical-face-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: beggars-canonical-face-diagnostic
  cancel-in-progress: true

jobs:
  render-canonical-face-variants:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Register exact diagnostic run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'evidence\latest-beggars-canonical-diagnostic'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{
            classification = 'RUN_REGISTERED'
            workflow_run_id = [long]'${{ github.run_id }}'
            status = 'in_progress'
            conclusion = $null
            head_sha = '${{ github.sha }}'
            head_branch = '${{ github.ref_name }}'
            url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'run-registration.json') -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- (Join-Path $evidence 'run-registration.json')
          git commit -m "evidence(scene): register canonical diagnostic ${{ github.run_id }}"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if ($LASTEXITCODE -ne 0) { throw "Registration rebase failed on attempt $attempt" }
            git push origin HEAD:agent/blender-beggars-scene-20260804
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw 'Could not publish diagnostic run registration' }
            Start-Sleep -Seconds 2
          }

      - name: Ensure reconstruction runtime
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\ensure-beggars-v2-runtime.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime bootstrap failed with exit code $LASTEXITCODE"
          }

      - name: Apply canonical Blender runtime compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-canonical-runtime-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical Blender compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Apply projective v3 import compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-canonical-v3-import-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical v3 import compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Route diagnostic through projective v3 renderer
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-canonical-v3-runner.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical projective v3 routing failed with exit code $LASTEXITCODE"
          }

      - name: Rebuild track and render canonical variants
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\run-beggars-canonical-diagnostic.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical visual diagnostic failed with exit code $LASTEXITCODE"
          }

      - name: Commit compact canonical diagnostic receipts
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout -- blender\diagnose_beggars_canonical_face.py blender\diagnose_beggars_canonical_face_v3.py scripts\run-beggars-canonical-diagnostic.ps1
          $evidence = 'evidence\latest-beggars-canonical-diagnostic'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          if ($env:CANONICAL_DIAGNOSTIC_OUTPUT -and (Test-Path -LiteralPath $env:CANONICAL_DIAGNOSTIC_OUTPUT)) {
            Get-ChildItem -LiteralPath $env:CANONICAL_DIAGNOSTIC_OUTPUT -Filter '*.json' -File | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $evidence $_.Name) -Force
            }
          }
          git add -- $evidence
          if (@(git diff --cached --name-only).Count -gt 0) {
            git commit -m "evidence(scene): record canonical face diagnostic ${{ github.run_id }}"
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              git pull --rebase origin agent/blender-beggars-scene-20260804
              if ($LASTEXITCODE -ne 0) { throw "Receipt rebase failed on attempt $attempt" }
              git push origin HEAD:agent/blender-beggars-scene-20260804
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw 'Could not publish canonical diagnostic receipts' }
              Start-Sleep -Seconds 2
            }
          }

      - name: Upload canonical diagnostic renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beggars-canonical-diagnostic-${{ github.run_id }}
          path: |
            ${{ env.CANONICAL_DIAGNOSTIC_OUTPUT }}/*.png
            ${{ env.CANONICAL_DIAGNOSTIC_OUTPUT }}/*.json
          if-no-files-found: warn
          retention-days: 14
