name: Branch tests

on:
  push:
    branches:
      - "fix/**"
      - "dev"
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install control dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-control.txt pytest
      - name: Compile Python sources
        run: |
          python -m compileall -q src workers blender tests
      - name: Run tests
        env:
          PYTHONPATH: "src:."
        run: python -m pytest tests -q
