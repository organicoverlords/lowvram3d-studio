name: Shaman geometry-first pipeline on local PC

on:
  workflow_dispatch:
  push:
    branches:
      - infra/windows-self-hosted-runner-20260731
    paths:
      - .github/workflows/shaman-local-worker.yml
      - scripts/run-shaman-geometry-iteration.ps1
      - workers/run_geometry_iteration.py
      - blender/geometry_iteration_validate.py
      - workers/comfyui_mini_turbo.py
      - src/lowvram3d/pipeline.py
      - src/lowvram3d/avatar.py

permissions:
  contents: write

concurrency:
  group: shaman-local-worker
  cancel-in-progress: true

jobs:
  geometry-first:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64, lowvram3d-pc]
    timeout-minutes: 120
    steps:
      - name: Checkout exact worker branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/infra/windows-self-hosted-runner-20260731") {
            throw "Ref is not the dedicated trusted worker branch"
          }
          $dirty = @(git status --short)
          if ($dirty.Count -gt 0) {
            throw "Runner checkout is dirty before execution: $($dirty -join '; ')"
          }
          git rev-parse HEAD

      - name: Preflight geometry iteration
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "LowVRAM3D control Python is missing: $python"
          }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python -m py_compile `
            workers\run_geometry_iteration.py `
            blender\geometry_iteration_validate.py
          if ($LASTEXITCODE -ne 0) {
            throw "Geometry iteration Python preflight failed with exit code $LASTEXITCODE"
          }
          $null = [scriptblock]::Create(
            (Get-Content .\scripts\run-shaman-geometry-iteration.ps1 -Raw)
          )

      - name: Build fresh shaman geometry
        shell: powershell
        run: |
          & .\scripts\run-shaman-geometry-iteration.ps1 -PreserveFaces 350000

      - name: Publish geometry receipt to branch
        if: always()
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP "shaman-geometry-iteration"
          $evidence = Join-Path $PWD "evidence\latest-geometry-iteration"
          if (Test-Path -LiteralPath $evidence) {
            Remove-Item -LiteralPath $evidence -Recurse -Force
          }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $result = Join-Path $source "geometry_iteration_result.json"
          $validation = Join-Path $source "deliverable\geometry_validation.json"
          $jobDir = Join-Path $source "job_dir.txt"
          if (Test-Path -LiteralPath $result) {
            Copy-Item -LiteralPath $result -Destination (Join-Path $evidence "geometry_iteration_result.json") -Force
          }
          if (Test-Path -LiteralPath $validation) {
            Copy-Item -LiteralPath $validation -Destination (Join-Path $evidence "geometry_validation.json") -Force
          }
          if (Test-Path -LiteralPath $jobDir) {
            Copy-Item -LiteralPath $jobDir -Destination (Join-Path $evidence "job_dir.txt") -Force
          }

          $receipt = [ordered]@{
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            workflow = "${{ github.workflow }}"
            head_sha = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            recorded_at = (Get-Date).ToUniversalTime().ToString("o")
            result_present = (Test-Path -LiteralPath $result)
            validation_present = (Test-Path -LiteralPath $validation)
            artifact_source = $source
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence "workflow_receipt.json") -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/latest-geometry-iteration
          $changes = @(git status --porcelain -- evidence/latest-geometry-iteration)
          if ($changes.Count -gt 0) {
            git commit -m "evidence: record shaman geometry run ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit geometry run receipt" }
            git push origin HEAD:infra/windows-self-hosted-runner-20260731
            if ($LASTEXITCODE -ne 0) { throw "Could not push geometry run receipt" }
          }

      - name: Upload geometry model and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaman-geometry-iteration-${{ github.run_id }}
          path: ${{ runner.temp }}\shaman-geometry-iteration
          if-no-files-found: error
          retention-days: 14
