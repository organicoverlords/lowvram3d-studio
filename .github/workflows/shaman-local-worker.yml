name: Shaman geometry-first pipeline on local PC

on:
  workflow_dispatch:
  push:
    branches:
      - infra/windows-self-hosted-runner-20260731
    paths:
      - .github/workflows/shaman-local-worker.yml
      - scripts/run-shaman-geometry-iteration.ps1
      - workers/run_geometry_iteration.py
      - blender/geometry_iteration_validate.py
      - workers/comfyui_mini_turbo.py
      - src/lowvram3d/pipeline.py
      - src/lowvram3d/avatar.py

permissions:
  contents: read

concurrency:
  group: shaman-local-worker
  cancel-in-progress: true

jobs:
  geometry-first:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64, lowvram3d-pc]
    timeout-minutes: 120
    steps:
      - name: Checkout exact worker branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/infra/windows-self-hosted-runner-20260731") {
            throw "Ref is not the dedicated trusted worker branch"
          }
          $dirty = @(git status --short)
          if ($dirty.Count -gt 0) {
            throw "Runner checkout is dirty before execution: $($dirty -join '; ')"
          }
          git rev-parse HEAD

      - name: Preflight geometry iteration
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "LowVRAM3D control Python is missing: $python"
          }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python -m py_compile `
            workers\run_geometry_iteration.py `
            blender\geometry_iteration_validate.py
          if ($LASTEXITCODE -ne 0) {
            throw "Geometry iteration Python preflight failed with exit code $LASTEXITCODE"
          }
          $null = [scriptblock]::Create(
            (Get-Content .\scripts\run-shaman-geometry-iteration.ps1 -Raw)
          )

      - name: Build fresh shaman geometry
        shell: powershell
        run: |
          & .\scripts\run-shaman-geometry-iteration.ps1 -PreserveFaces 350000

      - name: Upload geometry model and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaman-geometry-iteration-${{ github.run_id }}
          path: ${{ runner.temp }}\shaman-geometry-iteration
          if-no-files-found: error
          retention-days: 14
