name: Shaman textured baseline on local PC

on:
  workflow_dispatch:
  push:
    branches:
      - infra/windows-self-hosted-runner-20260731
    paths:
      - .github/workflows/shaman-local-worker.yml
      - scripts/recover-shaman-textured-baseline.ps1
      - workers/recover_textured_baseline.py
      - src/lowvram3d/raster_route.py
      - workers/raster_project.py
      - blender/raster_cleanup_extract.py
      - blender/raster_export.py
      - blender/geometry_quality_validate.py

permissions:
  contents: read

concurrency:
  group: shaman-local-worker
  cancel-in-progress: true

jobs:
  recover-textured-baseline:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64, lowvram3d-pc]
    timeout-minutes: 45
    steps:
      - name: Checkout exact worker branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/infra/windows-self-hosted-runner-20260731") {
            throw "Ref is not the dedicated trusted worker branch"
          }
          $dirty = @(git status --short)
          if ($dirty.Count -gt 0) { throw "Runner checkout is dirty before execution: $($dirty -join '; ')" }
          git rev-parse HEAD

      - name: Preflight recovery code
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "LowVRAM3D control Python is missing: $python"
          }
          $env:PYTHONPATH = "$PWD\src;$PWD"
          & $python -m py_compile `
            workers\recover_textured_baseline.py `
            src\lowvram3d\raster_route.py `
            workers\raster_project.py
          if ($LASTEXITCODE -ne 0) {
            throw "Recovery Python preflight failed with exit code $LASTEXITCODE"
          }
          $null = [scriptblock]::Create((Get-Content .\scripts\recover-shaman-textured-baseline.ps1 -Raw))

      - name: Recover first textured shaman GLB
        shell: powershell
        run: |
          & .\scripts\recover-shaman-textured-baseline.ps1 -AtlasSize 512

      - name: Upload textured baseline and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaman-textured-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}\shaman-textured-baseline
          if-no-files-found: error
          retention-days: 14
