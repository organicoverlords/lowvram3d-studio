name: Shaman image-to-3D on local PC

on:
  workflow_dispatch:
  push:
    branches:
      - infra/windows-self-hosted-runner-20260731
    paths:
      - .github/workflows/shaman-local-worker.yml
      - scripts/register-local-github-worker.ps1
      - scripts/run-shaman-image-to-3d.ps1
      - workers/run_full_image.py
      - workers/component_audit_cleanup.py
      - src/lowvram3d/component_audit.py

permissions:
  contents: read

concurrency:
  group: shaman-local-worker
  cancel-in-progress: true

jobs:
  shaman-image-to-3d:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64, lowvram3d-pc]
    timeout-minutes: 360
    steps:
      - name: Checkout exact worker branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/infra/windows-self-hosted-runner-20260731") {
            throw "Ref is not the dedicated trusted worker branch"
          }
          $dirty = @(git status --short)
          if ($dirty.Count -gt 0) { throw "Runner checkout is dirty before execution: $($dirty -join '; ')" }
          git rev-parse HEAD

      - name: Run full shaman PNG to 3D pipeline
        shell: powershell
        run: |
          & .\scripts\run-shaman-image-to-3d.ps1

      - name: Upload proof and deliverable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaman-image-to-3d-${{ github.run_id }}
          path: ${{ runner.temp }}\shaman-image-to-3d
          if-no-files-found: warn
          retention-days: 14
