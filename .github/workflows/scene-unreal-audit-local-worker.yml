name: Read-only Unreal scene audit on local PC
run-name: Unreal scene audit ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/scene-pipeline-smoke-20260803
    paths:
      - .github/workflows/scene-unreal-audit-local-worker.yml
      - unreal/audit_scene_contract.py
      - src/lowvram3d/scene_camera.py
      - evidence/latest-scene-camera-local-worker/camera_contract.json

permissions:
  contents: write

concurrency:
  group: scene-unreal-audit-local-worker
  cancel-in-progress: true

jobs:
  audit-unreal-scene:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact scene branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted checkout and local Unreal route
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/scene-pipeline-smoke-20260803") { throw "Untrusted ref" }
          if (@(git status --short).Count -gt 0) { throw "Checkout is dirty" }
          "WORKER_HEAD=$(git rev-parse HEAD)" | Add-Content -LiteralPath $env:GITHUB_ENV

          $project = "C:\Users\Lauri\Desktop\UnrealAITest58\UnrealAITest58.uproject"
          $editor = "C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          if (-not (Test-Path -LiteralPath $project)) { throw "Unreal project is missing: $project" }
          if (-not (Test-Path -LiteralPath $editor)) { throw "UnrealEditor-Cmd is missing: $editor" }
          $existing = @(Get-Process UnrealEditor, UnrealEditor-Cmd -ErrorAction SilentlyContinue)
          if ($existing.Count -gt 0) {
            throw "Unreal Editor is already running; refusing to interfere with PID(s): $($existing.Id -join ',')"
          }
          "SCENE_UPROJECT=$project" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_UNREAL_CMD=$editor" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_UNREAL_MAP=/Game/AgentProof/ImageToSceneSmoke_20260803/Maps/L_Castlegrounds_ImageToScene_Smoke" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_UNREAL_MESH_ASSET=/Game/AgentProof/ImageToSceneSmoke_20260803/Geometry/CastlegroundsSourceMeshV2/castlegrounds_source_mesh_v2/StaticMeshes/castlegrounds_source_mesh_v2.castlegrounds_source_mesh_v2" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_BUILD_RECEIPT=$PWD\proof\scene\20260803-image-to-scene-smoke\scene_build_receipt.json" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_CAMERA_CONTRACT=$PWD\evidence\latest-scene-camera-local-worker\camera_contract.json" | Add-Content -LiteralPath $env:GITHUB_ENV
          "SCENE_UNREAL_AUDIT_OUTPUT=$PWD\evidence\latest-scene-unreal-audit-local-worker\unreal_scene_contract_audit.json" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Compile audit script and parse contracts
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\LowVRAM3DStudio\envs\control\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python)) { $python = (Get-Command python.exe -ErrorAction Stop).Source }
          & $python -m py_compile unreal\audit_scene_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Unreal audit Python compile failed" }
          & $python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8-sig')) for p in [r'$env:SCENE_BUILD_RECEIPT',r'$env:SCENE_CAMERA_CONTRACT']]; print('UNREAL_AUDIT_INPUTS=PROVEN')"
          if ($LASTEXITCODE -ne 0) { throw "Unreal audit input parse failed" }

      - name: Run Unreal Python commandlet read-only audit
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-unreal-audit-local-worker"
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $script = (Resolve-Path "unreal\audit_scene_contract.py").Path
          $log = Join-Path $evidence "unreal_commandlet.log"
          & $env:SCENE_UNREAL_CMD $env:SCENE_UPROJECT `
            -run=pythonscript `
            "-script=$script" `
            -unattended -nop4 -nosplash -nullrhi `
            -stdout -FullStdOutLogOutput 2>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $env:SCENE_UNREAL_AUDIT_OUTPUT)) {
            throw "Unreal audit wrote no JSON receipt; commandlet exit=$exit"
          }
          if ($exit -ne 0) { throw "Unreal audit commandlet failed with exit code $exit" }

      - name: Verify read-only audit receipt
        shell: powershell
        run: |
          $receipt = Get-Content -LiteralPath $env:SCENE_UNREAL_AUDIT_OUTPUT -Raw | ConvertFrom-Json
          if ($receipt.classification -ne "PROVEN") { throw "Unreal scene audit rejected: $($receipt.errors | ConvertTo-Json -Compress)" }
          if (-not $receipt.map_loaded) { throw "Proven map was not loaded" }
          if (-not $receipt.mesh_asset_exists) { throw "Proven mesh asset is missing" }
          if ($receipt.expected_mesh_actor_count -ne 1) { throw "Expected exactly one source-mesh actor" }
          if (-not $receipt.source_mesh_reference_preserved) { throw "Source mesh reference changed" }
          if (-not $receipt.source_camera_contract_preserved) { throw "Source camera contract changed" }
          if ($receipt.fov_error_deg -gt 0.0001) { throw "Source camera FOV mismatch" }
          if ($receipt.forward_error -gt 0.0001) { throw "Source camera direction mismatch" }
          if ($receipt.asset_write_attempted -or $receipt.actor_write_attempted -or $receipt.save_called -or $receipt.import_called -or $receipt.render_called) {
            throw "Read-only audit attempted a mutating or rendering operation"
          }
          Write-Host ($receipt | ConvertTo-Json -Depth 10)

      - name: Publish compact Unreal audit evidence
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path $PWD "evidence\latest-scene-unreal-audit-local-worker"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{
            classification = if ("${{ job.status }}" -eq "success") { "PROVEN" } else { "REJECTED" }
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            head_sha = "${{ github.sha }}"
            worker_head = $env:WORKER_HEAD
            scope = "UNREAL_SAVED_SCENE_READ_ONLY_AUDIT"
            gpu_work_started = $false
            neural_work_started = $false
            blender_work_started = $false
            unreal_render_started = $false
            unreal_mutation_authorized = $false
            recorded_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content (Join-Path $evidence "workflow_receipt.json") -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/latest-scene-unreal-audit-local-worker/*.json
          if (@(git status --porcelain -- evidence/latest-scene-unreal-audit-local-worker).Count -gt 0) {
            git commit -m "evidence(scene): record read-only Unreal audit ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit Unreal audit evidence" }
            git push origin HEAD:agent/scene-pipeline-smoke-20260803
            if ($LASTEXITCODE -ne 0) { throw "Could not push Unreal audit evidence" }
          }

      - name: Upload Unreal audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-unreal-audit-${{ github.run_id }}
          path: evidence/latest-scene-unreal-audit-local-worker/*
          if-no-files-found: warn
          retention-days: 14
