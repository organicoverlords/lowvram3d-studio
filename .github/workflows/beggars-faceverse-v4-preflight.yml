name: Beggars FaceVerse v4 visual preflight
run-name: Beggars FaceVerse v4 visual preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - evidence/faceverse-v4-trigger.json
      - tools/beggars_scene/run_faceverse_v4_preflight.py
      - scripts/run-beggars-faceverse-v4-preflight.ps1
      - scripts/apply-beggars-faceverse-v4-python-compat.ps1
      - scripts/apply-beggars-faceverse-v4-native-compat.ps1
      - scripts/apply-beggars-faceverse-v4-venv-compat.ps1
      - scripts/apply-beggars-faceverse-v4-probe-compat.ps1
      - scripts/apply-beggars-faceverse-v4-release-fallback.ps1
      - scripts/apply-beggars-faceverse-v4-stage-trace.ps1
      - scripts/apply-beggars-faceverse-v4-isolated-proof.ps1
      - .github/workflows/beggars-faceverse-v4-preflight.yml

permissions:
  contents: read

concurrency:
  group: beggars-faceverse-v4-preflight
  cancel-in-progress: true

jobs:
  reconstruct-and-render-one-head:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75

    steps:
      - name: Checkout exact FaceVerse preflight source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Prepare clean run identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('.git\rebase-merge', '.git\rebase-apply')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          Write-Host 'FACEVERSE_RUN_ID=${{ github.run_id }}'
          Write-Host 'FACEVERSE_HEAD_SHA=${{ github.sha }}'
          Write-Host 'FACEVERSE_RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          Write-Host 'FACEVERSE_RUN_IDENTITY=PROVEN'

      - name: Apply FaceVerse Python discovery compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-python-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse Python compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Apply FaceVerse native process compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-native-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse native-process compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Apply FaceVerse uv venv compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-venv-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse uv-venv compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Apply FaceVerse probe and seeded-venv compatibility
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-probe-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse probe compatibility failed with exit code $LASTEXITCODE"
          }

      - name: Apply validated FaceVerse release fallback
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-release-fallback.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse release fallback patch failed with exit code $LASTEXITCODE"
          }

      - name: Trace FaceVerse proof stages
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-stage-trace.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse stage-trace patch failed with exit code $LASTEXITCODE"
          }

      - name: Isolate FaceVerse proof environment
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\apply-beggars-faceverse-v4-isolated-proof.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse isolated-proof patch failed with exit code $LASTEXITCODE"
          }

      - name: Run bounded FaceVerse v4 proof
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\run-beggars-faceverse-v4-preflight.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FaceVerse v4 preflight failed with exit code $LASTEXITCODE"
          }

      - name: Upload FaceVerse visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beggars-faceverse-v4-preflight-${{ github.run_id }}
          path: |
            ${{ env.FACEVERSE_V4_OUTPUT }}/faceverse_v4_render.png
            ${{ env.FACEVERSE_V4_OUTPUT }}/faceverse_v4_depth.png
            ${{ env.FACEVERSE_V4_OUTPUT }}/faceverse_v4_colored_head.ply
            ${{ env.FACEVERSE_V4_OUTPUT }}/faceverse_v4_coefficients.npz
            ${{ env.FACEVERSE_V4_OUTPUT }}/*.json
          if-no-files-found: warn
          retention-days: 14
