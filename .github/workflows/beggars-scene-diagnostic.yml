name: Beggars scene local-worker diagnostic
run-name: Beggars scene diagnostic ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - .github/workflows/beggars-scene-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: beggars-scene-diagnostic
  cancel-in-progress: true

jobs:
  inspect-latest-local-run:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify source of truth
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'refs/heads/agent/blender-beggars-scene-20260804'
          if ('${{ github.ref }}' -ne $expected) { throw "Wrong ref: ${{ github.ref }}" }
          $remote = git remote get-url origin
          if ($remote -notmatch 'organicoverlords/lowvram3d-studio') { throw "Wrong remote: $remote" }
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.sha }}') { throw "HEAD mismatch: $head" }
          if (@(git status --short).Count -gt 0) { throw 'Dirty checkout' }
          "DIAG_HEAD=$head" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Inspect bounded local run receipts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\AI\LowVRAM3D-benchmarks\beggars-scene'
          $evidence = Join-Path $PWD 'evidence\latest-beggars-scene-diagnostic'
          if (Test-Path -LiteralPath $evidence) { Remove-Item -LiteralPath $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $runs = @()
          if (Test-Path -LiteralPath $root) {
            $runs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'run-*' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 5)
          }

          $summaries = @()
          foreach ($run in $runs) {
            $artifact = Join-Path $run.FullName 'artifact'
            $finalReceiptPath = Join-Path $artifact 'workflow_final_receipt.json'
            $workerReceiptPath = Join-Path $artifact 'worker_receipt.json'
            $safeFiles = @()
            if (Test-Path -LiteralPath $artifact) {
              $safeFiles = @(Get-ChildItem -LiteralPath $artifact -File | ForEach-Object {
                [ordered]@{ name = $_.Name; bytes = $_.Length; modified_utc = $_.LastWriteTimeUtc.ToString('o') }
              })
            }
            $finalReceipt = $null
            if (Test-Path -LiteralPath $finalReceiptPath) {
              try { $finalReceipt = Get-Content -LiteralPath $finalReceiptPath -Raw | ConvertFrom-Json }
              catch { $finalReceipt = [ordered]@{ parse_error = $_.Exception.Message } }
            }
            $workerReceipt = $null
            if (Test-Path -LiteralPath $workerReceiptPath) {
              try { $workerReceipt = Get-Content -LiteralPath $workerReceiptPath -Raw | ConvertFrom-Json }
              catch { $workerReceipt = [ordered]@{ parse_error = $_.Exception.Message } }
            }
            $summaries += [ordered]@{
              run_directory = $run.Name
              modified_utc = $run.LastWriteTimeUtc.ToString('o')
              final_receipt = $finalReceipt
              worker_receipt = $workerReceipt
              artifact_files = $safeFiles
              private_reference_content_listed = $false
            }
          }

          $diagnostic = [ordered]@{
            classification = if ($runs.Count -gt 0) { 'PROVEN_LOCAL_RUNS_DISCOVERED' } else { 'NOT_PROVEN_NO_LOCAL_RUN_DIRECTORY' }
            repository = '${{ github.repository }}'
            branch = '${{ github.ref_name }}'
            diagnostic_head = '${{ github.sha }}'
            worker_name = '${{ runner.name }}'
            worker_os = '${{ runner.os }}'
            worker_arch = '${{ runner.arch }}'
            diagnostic_workflow_run_id = '${{ github.run_id }}'
            inspected_root = $root
            run_count = $runs.Count
            runs = $summaries
            source_media_read = $false
            source_media_uploaded = $false
            recorded_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $diagnostic | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidence 'diagnostic.json') -Encoding utf8

      - name: Commit diagnostic evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidence/latest-beggars-scene-diagnostic/diagnostic.json
          if (@(git status --porcelain -- evidence/latest-beggars-scene-diagnostic).Count -eq 0) {
            throw 'Diagnostic did not produce evidence'
          }
          git commit -m "evidence(scene): inspect latest beggars local run ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit diagnostic evidence' }
          git push origin HEAD:agent/blender-beggars-scene-20260804
          if ($LASTEXITCODE -ne 0) { throw 'Could not push diagnostic evidence' }
