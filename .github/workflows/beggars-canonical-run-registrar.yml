name: Beggars canonical diagnostic registrar

on:
  workflow_run:
    workflows:
      - Beggars canonical face diagnostic
    types:
      - requested
      - in_progress
      - completed

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Write latest run registration
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: agent/blender-beggars-scene-20260804
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git clone --depth 1 --branch "$TARGET_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$work/repo"
          cd "$work/repo"
          mkdir -p evidence/latest-beggars-canonical-diagnostic
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "classification": "RUN_REGISTERED",
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_name": os.environ["RUN_NAME"],
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ.get("RUN_CONCLUSION") or None,
              "head_sha": os.environ["RUN_HEAD_SHA"],
              "url": os.environ["RUN_URL"],
          }
          Path("evidence/latest-beggars-canonical-diagnostic/run-registration.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/latest-beggars-canonical-diagnostic/run-registration.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence(scene): register canonical diagnostic ${RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            git pull --rebase origin "$TARGET_BRANCH"
          done
          exit 1
