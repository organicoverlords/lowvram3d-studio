name: Beggars FaceVerse pair audit registrar
run-name: Register FaceVerse pair audit ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/blender-beggars-scene-20260804
    paths:
      - tools/beggars_scene/audit_faceverse_v4_pair.py
      - .github/workflows/beggars-faceverse-pair-audit.yml
      - .github/workflows/beggars-faceverse-pair-audit-registrar.yml

permissions:
  actions: read
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record latest pair-audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/beggars-faceverse-pair-audit.yml/runs?branch=agent%2Fblender-beggars-scene-20260804&per_page=20")"
          run="$(printf '%s' "$response" | jq -c '.workflow_runs | sort_by(.created_at) | reverse | .[0]')"
          test "$run" != "null"
          mkdir -p evidence/latest-beggars-faceverse-pair-audit
          printf '%s' "$run" | jq '{classification:"RUN_REGISTERED",workflow_run_id:.id,status,conclusion,head_sha,head_branch,created_at,updated_at,url:.html_url}' > evidence/latest-beggars-faceverse-pair-audit/run-registration.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/latest-beggars-faceverse-pair-audit/run-registration.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(scene): register FaceVerse pair audit $(printf '%s' "$run" | jq -r '.id')"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/blender-beggars-scene-20260804
            if git push origin HEAD:agent/blender-beggars-scene-20260804; then exit 0; fi
            test "$attempt" -lt 4
            sleep 2
          done
