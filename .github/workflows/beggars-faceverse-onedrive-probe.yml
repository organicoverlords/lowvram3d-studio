name: Beggars FaceVerse OneDrive probe
run-name: Beggars FaceVerse OneDrive probe ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches: [agent/blender-beggars-scene-20260804]
    paths:
      - scripts/probe-faceverse-onedrive.ps1
      - .github/workflows/beggars-faceverse-onedrive-probe.yml

permissions:
  contents: write

concurrency:
  group: beggars-faceverse-onedrive-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Probe official OneDrive shares
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\probe-faceverse-onedrive.ps1
          if ($LASTEXITCODE -ne 0) { throw "OneDrive probe failed with exit code $LASTEXITCODE" }
      - name: Publish compact probe receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'evidence\latest-beggars-faceverse-onedrive-probe'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:FACEVERSE_ONEDRIVE_PROBE_OUTPUT 'probe.json') -Destination (Join-Path $evidence 'probe.json') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $evidence
          git commit -m "evidence(scene): record FaceVerse OneDrive probe ${{ github.run_id }}"
          git pull --rebase origin agent/blender-beggars-scene-20260804
          git push origin HEAD:agent/blender-beggars-scene-20260804
      - uses: actions/upload-artifact@v4
        with:
          name: faceverse-onedrive-probe-${{ github.run_id }}
          path: ${{ env.FACEVERSE_ONEDRIVE_PROBE_OUTPUT }}/probe.json
          if-no-files-found: error
          retention-days: 3
