name: Rig vendor preflight on local PC
run-name: Vendor rig preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/studio-rig-pipeline-20260807
    paths:
      - .github/workflows/rig-vendor-preflight-local-worker.yml
      - tools/rig_vendor_preflight.ps1
      - integrations/vendor/ComfyUI-UniRig/**

permissions:
  contents: read

concurrency:
  group: rig-vendor-preflight-local-worker
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository_owner == 'organicoverlords'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact rigging branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify trusted ref and clean checkout
        shell: powershell
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/agent/studio-rig-pipeline-20260807") {
            throw "Ref is not the dedicated trusted rigging branch"
          }
          if (@(git status --short).Count -gt 0) { throw "Checkout is dirty before preflight" }
          git rev-parse HEAD

      - name: Inspect stock rigging environment without CUDA
        shell: powershell
        run: |
          ./tools/rig_vendor_preflight.ps1 -Output "evidence/rigging/vendor_preflight.json"
          if ($LASTEXITCODE -ne 0) { throw "Vendor preflight script failed" }

      - name: Upload vendor preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: rig-vendor-preflight-${{ github.run_id }}
          path: evidence/rigging/vendor_preflight.json
          if-no-files-found: error
          retention-days: 14
