name: Patch duplicate jungle Unreal guard
run-name: Jungle inner Unreal guard dedup ${{ github.run_id }}

on:
  push:
    branches:
      - feature/procedural-jungle-playable-20260804
    paths:
      - worker-triggers/procedural-jungle-bundle-diagnostic.txt

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/procedural-jungle-playable-20260804
          clean: true
          fetch-depth: 0

      - name: Insert post-install duplicate-guard removal
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/procedural_jungle/run-procedural-jungle-local-worker.ps1")
          text = path.read_text(encoding="utf-8")
          marker = "JUNGLE_INNER_UNREAL_GUARD_DEDUP_V1"
          if marker in text:
              raise SystemExit("inner Unreal guard dedup patch already exists")

          anchor = '''Write-Host "JUNGLE_GPU_PREBUILD_UTIL_PERCENT=$GpuUtilPercent"

'@
$PatchedText = $PatchedText.Substring(0, $PreflightStart) + $CoexistencePreflight.TrimEnd() + "`n" + $PatchedText.Substring($BuildIndex)'''
          if text.count(anchor) != 1:
              raise SystemExit(f"unexpected coexistence-tail anchor count: {text.count(anchor)}")

          block = r'''Write-Host "JUNGLE_GPU_PREBUILD_UTIL_PERCENT=$GpuUtilPercent"

$InnerBuildPath = Join-Path $ExtractRoot 'scripts\procedural_jungle\build-procedural-jungle.ps1'
$InnerBuildLines = New-Object 'System.Collections.Generic.List[string]'
foreach ($InnerLine in @(Get-Content -LiteralPath $InnerBuildPath)) {
    [void]$InnerBuildLines.Add([string]$InnerLine)
}
$GuardStarts = @()
for ($InnerIndex = 0; $InnerIndex -lt $InnerBuildLines.Count; $InnerIndex++) {
    if ($InnerBuildLines[$InnerIndex].Trim() -eq '$ExistingUnreal = @(Get-Process UnrealEditor, UnrealEditor-Cmd -ErrorAction SilentlyContinue)') {
        $GuardStarts += $InnerIndex
    }
}
if ($GuardStarts.Count -ne 1) {
    throw "Unexpected inner Unreal guard start count: $($GuardStarts.Count)"
}
$GuardStart = [int]$GuardStarts[0]
if ($GuardStart + 3 -ge $InnerBuildLines.Count -or
    $InnerBuildLines[$GuardStart + 1].Trim() -ne 'if ($ExistingUnreal.Count -gt 0) {' -or
    $InnerBuildLines[$GuardStart + 2].IndexOf('Unreal Editor is already running; refusing to interfere', [StringComparison]::Ordinal) -lt 0 -or
    $InnerBuildLines[$GuardStart + 3].Trim() -ne '}') {
    throw 'Inner Unreal guard shape differs from the audited four-line block'
}
$InnerBuildLines.RemoveRange($GuardStart, 4)
$InnerBuildLines.Insert($GuardStart, "Write-Host 'JUNGLE_INNER_UNREAL_GUARD_DEDUP_V1=PROVEN'")
[IO.File]::WriteAllLines($InnerBuildPath, $InnerBuildLines, (New-Object Text.UTF8Encoding($false)))
$InnerBuildVerify = Get-Content -LiteralPath $InnerBuildPath -Raw
if ($InnerBuildVerify -match 'Unreal Editor is already running; refusing to interfere') {
    throw 'Duplicate blanket Unreal guard remains after dedup patch'
}
Write-Host 'JUNGLE_INNER_UNREAL_GUARD_DEDUP_PATCH=PROVEN'

'@
$PatchedText = $PatchedText.Substring(0, $PreflightStart) + $CoexistencePreflight.TrimEnd() + "`n" + $PatchedText.Substring($BuildIndex)'''

          path.write_text(text.replace(anchor, block), encoding="utf-8")
          print("JUNGLE_INNER_UNREAL_GUARD_DEDUP_WORKER_PATCH=PROVEN")

      - name: Commit worker patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          grep -q 'JUNGLE_INNER_UNREAL_GUARD_DEDUP_V1' scripts/procedural_jungle/run-procedural-jungle-local-worker.ps1
          git add -- scripts/procedural_jungle/run-procedural-jungle-local-worker.ps1
          git commit -m "fix(jungle): deduplicate inner Unreal process guard"
          git push origin HEAD:feature/procedural-jungle-playable-20260804
