name: Repair jungle V3 installer fragment
run-name: Jungle V3 one-byte fragment repair ${{ github.run_id }}

on:
  push:
    branches:
      - feature/procedural-jungle-playable-20260804
    paths:
      - worker-triggers/procedural-jungle-bundle-diagnostic.txt

permissions:
  contents: write

jobs:
  repair-fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/procedural-jungle-playable-20260804
          clean: true
          fetch-depth: 0

      - name: Repair exactly one missing byte
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path("worker-bundles/procedural-jungle-v3-installer/chunk-04.pyfrag")
          raw = path.read_bytes()
          old_sha = hashlib.sha256(raw).hexdigest()
          expected_old_sha = "7ed43d0d95501af0179b00a5ea1eb1bf446b3601f81ca157aad6f1258e4155ca"
          expected_new_sha = "2f477fced48baa9457c0548dab4cbfc724639df4b51dc534021b09876fbe50e7"
          offset = 4015

          if len(raw) != 5999:
              raise SystemExit(f"unexpected old length: {len(raw)}")
          if old_sha != expected_old_sha:
              raise SystemExit(f"unexpected old sha: {old_sha}")
          if raw[offset - 8:offset + 12] != b"O4maLSWichtdn5U/zqHM8":
              raise SystemExit(f"unexpected repair context: {raw[offset - 8:offset + 12]!r}")

          repaired = raw[:offset] + b"n" + raw[offset:]
          new_sha = hashlib.sha256(repaired).hexdigest()
          if len(repaired) != 6000:
              raise SystemExit(f"unexpected repaired length: {len(repaired)}")
          if new_sha != expected_new_sha:
              raise SystemExit(f"unexpected repaired sha: {new_sha}")
          if repaired[offset - 8:offset + 13] != b"O4maLSWnichtdn5U/zqHM8":
              raise SystemExit("repaired context is incorrect")

          path.write_bytes(repaired)
          print("JUNGLE_V3_FRAGMENT_ONE_BYTE_REPAIR=PROVEN")
          print(f"OLD_SHA256={old_sha}")
          print(f"NEW_SHA256={new_sha}")
          print(f"REPAIR_OFFSET={offset}")
          print("INSERTED_BYTE=0x6e")

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git status --porcelain -- worker-bundles/procedural-jungle-v3-installer/chunk-04.pyfrag | wc -l)" -eq 1
          git add -- worker-bundles/procedural-jungle-v3-installer/chunk-04.pyfrag
          git commit -m "fix(jungle): restore one missing V3 installer byte"
          git push origin HEAD:feature/procedural-jungle-playable-20260804
