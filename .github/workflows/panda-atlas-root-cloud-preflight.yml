name: Panda atlas root cloud preflight
run-name: Panda atlas root cloud preflight ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - agent/panda-texture-artifact-root-fix-20260805
    paths:
      - .github/workflows/panda-atlas-root-cloud-preflight.yml
      - workers/conservative_atlas.py
      - workers/panda_atlas_root_diagnostic.py
      - workers/build_contact_sheet.py
      - blender/render_glb_diagnostic_set.py
      - tests/test_conservative_atlas.py

permissions:
  contents: read

jobs:
  focused-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow pytest
      - name: Compile diagnostic lane
        run: |
          python -m py_compile \
            workers/conservative_atlas.py \
            workers/panda_atlas_root_diagnostic.py \
            workers/build_contact_sheet.py
      - name: Run conservative atlas tests
        env:
          PYTHONPATH: "workers:."
        run: python -m pytest tests/test_conservative_atlas.py -q
      - name: Record preflight receipt
        run: |
          mkdir -p preflight-receipt
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          paths = [
              Path("workers/conservative_atlas.py"),
              Path("workers/panda_atlas_root_diagnostic.py"),
              Path("workers/build_contact_sheet.py"),
              Path("blender/render_glb_diagnostic_set.py"),
              Path("tests/test_conservative_atlas.py"),
          ]
          receipt = {
              "schema": "panda_atlas_root_cloud_preflight_v1",
              "head_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "classification": "SYNTHETIC_PREFLIGHT_ONLY",
              "local_panda_assets_examined": False,
              "production_asset_written": False,
              "files": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in paths
              },
          }
          Path("preflight-receipt/receipt.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: panda-atlas-root-cloud-preflight-${{ github.run_id }}
          path: preflight-receipt/receipt.json
          retention-days: 14
